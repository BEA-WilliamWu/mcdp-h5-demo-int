openapi: 3.0.3
info:
  title: BEA H2H API - Local Payments
  description: |
    API to process local payments including Bank Transfer, CHATS, and FPS.

    ## Request Headers

    | Header | Type | Required | Description | Remarks | Category |
    |--------|------|:--------:|-------------|---------|----------|
    | Message-Id | string (max 36) | ✅ | Message ID. UUID v4 format. Sample: `"1f0ee48b-ce99-475f-8b72-52a7a492edfa"`. | Constant `"Server-Define"` will lead to UUID generated by H2H system. | common |
    | Authorization | string | ✅ | Access token returned from logon API. Format: `Bearer ${access_token}`. | The token includes user client ID, validated by DSP. | common |
    | Channel | string (enum) | ✅ | Channel identifier. Allowed values: `H2H` / `BCO` / `BCM`. Corporate hardcode `"H2H"`. | | common |
    | Client-Id | string | ✅ | DSP client ID, for audit log purpose. | | BFF only |
    | Request-Time | Long (int64) | ✅ | 13-digit millisecond-level timestamp. | The timestamp must be within the past 5 minutes compared to H2H system time. | BFF only |
    | Payload-Sign | string | ✅ | Signature of the request payload with corporate private key. Sign format: `{HTTP_METHOD}\n{URI_PATH}\n{QUERY_STRING}\n{Request-Time}\n{SHA256(BODY)}`. The request body is included only when the request MediaType is `application/json`. H2H will verify the signature with correlated public key registered during corporate onboarding. | | BFF only |
    | X-IBM-Client-Id | string | ✅ | APIC client ID. Corporate retrieves the info when onboarding. | | APIC |
    | X-IBM-Client-Secret | string | ✅ | APIC secret. Corporate retrieves the info when onboarding. | | APIC |
  version: "1.0"

servers:
  - url: https://api.hkbea.com
    description: Production Server

tags:
  - name: LocalPayment
    description: Operations related to local payments (Bank Transfer, CHATS, FPS)

paths:
  /payment/v1/payment:
    post:
      tags:
        - LocalPayment
      summary: Local Payment Initiation
      description: |
        Unified local payment initiation endpoint. The request body is a concrete
        `PaymentInstructionRequest` with a `paymentType` field that determines which fields are relevant:

        | paymentType | Description | Relevant fields |
        |-------------|-------------|-----------------|
        | `ONUS` | On-Us (Internal) Payment | debtorAccount, instructedAmount, creditorAccount, settlementDate, paymentIdentification |
        | `CHATS` | CHATS Payment | debtorAccount, instructedAmount, creditorAccount, settlementDate, paymentIdentification, chargeBearer, paymentDetails |
        | `FPS` | FPS Payment | debtorAccount, instructedAmount, creditorAccount, settlementDate, paymentIdentification, paymentDetails |
        | `TT` | Overseas Telegraph Transfer | debtorAccount, instructedAmount, creditorAccount, settlementDate, paymentIdentification, chargeBearer, paymentDetails, creditorAgent, intermediaryAgent |
        | `DR` | Demand Draft | debtorAccount, instructedAmount, creditorAccount, settlementDate, paymentIdentification, chargeBearer, paymentDetails, creditorAgent, intermediaryAgent |
      operationId: processLocalPayment
      requestBody:
        required: true
        description: Unified payment request. The `paymentType` field determines which fields are relevant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInstructionRequest'
      responses:
        '200':
          description: Payment processed (success, accepted for schedule, or business-level rejection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '450':
          description: |
            Parameter validation failure. Response body is `ExceptionEntity`.

            See `./common/common-exceptions.0.0.openapi.yaml` for common 450 parameter validation errors
            (Message-Id / Authorization / Channel / Client-Id / Request-Time / Payload-Sign, etc.).

            Payment-type-specific validation error codes are documented in the corresponding schema:
            `BankTransfer`, `Chats`, and `Fps`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionEntity'
        '460':
          description: |
            Service / business logic failure. Response body is `ExceptionEntity`.

            See `./common/common-exceptions.0.0.openapi.yaml` for common 460 service/business-logic errors
            (debit account status, insufficient balance, transfer date, FX limit, host rejections,
            duplicate message ID, CHATS-specific 600118-600122, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionEntity'
        '470':
          description: |
            System-level error. Response body is `ExceptionEntity`.

            See `./common/common-exceptions.0.0.openapi.yaml` for common 470 system errors
            (host timeout, downstream unavailable, request processing timeout, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionEntity'
        '490':
          description: |
            Uncaught / general exception. Response body is `ExceptionEntity`.

            See `./common/common-exceptions.0.0.openapi.yaml` for common 490 general exceptions
            (`900000` general exception, `900101` remote call returned unexpected data, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionEntity'

  /payment/v1/transactions/enquiry:
    get:
      tags:
        - LocalPayment
      summary: Payment Transaction Record Enquiry
      description: |
        Enquires the status and details of an FPS, CHATS, TT, DR or On-Us payment submitted
        through the H2H API, identified by its transaction reference. Only payments
        belonging to the caller's own company (resolved from the access token) are
        visible. On-Us/DR records are looked up in INTERNAL, then FPS/CHATS/TT in PAYOUT.

        For stored `Pending` or `Processing` status, the latest result is queried from IPE.
        Changed status/rejection details are persisted. An inconclusive or failed IPE
        query retains the stored result. Final stored statuses are returned without refresh.

        Existing response field names, identifier mappings and ISO 8601 date-time
        encoding are retained pending clarification of the V0.1 specification comments.
      operationId: enquireTransactionRecord
      parameters:
        - name: txnRef
          in: query
          required: true
          description: Payment transaction reference number (PAYMENT_ID) returned by the payment initiation API.
          schema:
            type: string
            maxLength: 50
          example: "HTH20260727113727647063"
      responses:
        '200':
          description: The payment transaction with its latest status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
        '417':
          description: |
            HTH exception response (`ExceptionEntity`). Existing error codes include:
            - **500000**: txnRef exceeds 50 characters (field-prefixed invalid parameter message).
            - **500101**: Missing mandatory parameter (txnRef missing or blank).
            - **500070**: HTH API service is not enabled for the client's company.
            - **500071**: Invalid or expired access token.
            - **600131**: Payment transaction not found for the given transactionId.
            - **600210**: The requested API is under scheduled maintenance.
            - **600211**: A dependent third-party payment system is under maintenance.
            Maintenance responses may use the configured window message.
            Existing common authentication, entitlement and system errors also use HTTP 417.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionEntity'

components:

  schemas:
    # --- Shared / Common Schemas ---
    ExceptionEntity:
      $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
    Payment:
      type: object
      description: Common payment response returned for HTTP 200.
      properties:
        status:
          type: string
          description: Status Code.
          enum:
            - Processing
            - Success
            - Rejected
        txnTime:
          type: string
          format: date-time
          description: Transaction time. 13-digit millisecond-level Unix timestamp.
        txnRef:
          type: string
          description: Transaction Reference.
        rejectMessage:
          type: string
          description: "Reject message (populated when status = Rejected)."
        rejectCode:
          type: string
          description: "Reject code (populated when status = Rejected)."
        originalEndtoendID:
          type: string
          description: Original end-to-end ID from the request.
        originalTransactionID:
          type: string
          description: Original transaction ID from the request.
    Currency:
      $ref: './common/common-currency.0.0.openapi.yaml#/components/schemas/Currency'
    TxnAmount:
      $ref: './common/common-txn-amount.0.0.openapi.yaml#/components/schemas/TxnAmount'
    BeaAccount:
      $ref: './common/common-account.0.0.openapi.yaml#/components/schemas/BeaAccount'

    # --- Unified Payment Instruction Request ---
    PaymentInstructionRequest:
      type: object
      description: Root request body for a payment instruction.
      properties:
        paymentIdentification:
          $ref: '#/components/schemas/PaymentIdentification'
        creditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        intermediaryAgent:
          $ref: '#/components/schemas/IntermediaryAgent'
        debtorAccount:
          $ref: '#/components/schemas/AccountId'
        instructedAmount:
          $ref: '#/components/schemas/InstructedAmount'
        categoryPurpose:
          $ref: '#/components/schemas/CategoryPurpose'
        purpose:
          $ref: '#/components/schemas/Purpose'
        creditor:
          $ref: '#/components/schemas/Creditor'
        creditorAccount:
          $ref: '#/components/schemas/CreditorAccount'
        paymentType:
          type: string
          description: "Payment type discriminator. Allowed values: ONUS / FPS / CHATS / TT / DR / Others."
        transactionID:
          type: string
          description: "Client-assigned transaction ID used to correlate the instruction with the caller's own reference."
        settlementDate:
          type: string
          format: date
          description: "Settlement date / execution date. Current date = immediate payment; future date = scheduled payment."
        remittanceInformationUnstructured:
          type: string
          description: "Free-form remittance information. TT/FPS/CHATS may fill this. Max 140 characters."
        chargeBearer:
          type: string
          description: "Charge bearing code. TT/CHATS required. SHA = shared between parties; OUR = remitter bears all charges."

    # --- Debtor Account ---
    AccountId:
      type: object
      description: Debtor account from which funds are debited.
      properties:
        id:
          type: string
          description: Payment account number.
        type:
          type: string
          description: "Payment account type. Values: SSA / CUR / SAV / COL / TD."
        currency:
          type: string
          description: "Payment account currency (ISO 4217)."

    # --- Instructed Amount ---
    InstructedAmount:
      type: object
      description: Amount that the debtor instructs to be transferred.
      properties:
        amount:
          type: number
          description: Remittance amount.
        currency:
          type: string
          description: "Remittance currency (ISO 4217). TT supported currencies: HKD, USD, EUR, AUD, CAD, CHF, CNY, GBP, JPY, NZD, SGD."

    # --- Creditor Account ---
    CreditorAccount:
      type: object
      description: Account identification for the creditor side of the payment.
      properties:
        id:
          type: string
          description: "Creditor account number. MVP1 must be a bank account number; proxy ID not supported."
        accountIdentifier:
          type: string
          description: Account identifier type. Used in FPS scenarios.
        schemeName:
          $ref: '#/components/schemas/SchemeName'

    # --- Beneficiary / Destination Account ---
    PaymentToAccount:
      type: object
      description: |
        Unified beneficiary (destination) account information.
        Merges fields from BeaAccount, ChatsToAccount, and FpsToAccount.
        Fields not relevant to a given paymentType are simply left null.
        JSON property: `creditorAccount`.
      required:
        - currency
      properties:
        accountType:
          type: string
          description: 'Beneficiary Account Type. SSA – Savings Account, CUR – Current Account.'
          enum: ["SSA", "CUR"]
          example: "SSA"

        accountIdentifier:
          type: string
          maxLength: 4
          description: 'FPS Payment Identifier (FPS only). 01 – Account Number, 02 – Mobile No., 03 – Email Address, 04 – FPS ID, BBAN – Basic Bank Account Number.'
          enum: ["01", "02", "03", "04", "BBAN"]
          example: "01"

        id:
          type: string
          description: 'Account identifier (equivalent to accountNumber).'

        accountNumber:
          type: string
          maxLength: 34
          description: |
            Beneficiary Account Number.

            For BANK_TRANSFER / CHATS:
            Bank Code (3 digits) + Account Number.

            For FPS:
            Used only when accountIdentifier = 01.
            Format: Bank Code (3 digits) + Account Number.
          example: "0041234567890"

        type:
          type: string
          description: 'Account type (equivalent to accountType). SSA – Savings, CUR – Current.'
          enum: ["SSA", "CUR"]
          example: "SSA"

        mobileNumber:
          type: string
          maxLength: 20
          description: |
            Beneficiary Mobile Phone Number.

            Used only when accountIdentifier = 02.
            Country code must be included.

            Example:
            85298765432
          example: "85298765432"

        emailAddress:
          type: string
          format: email
          maxLength: 100
          description: |
            Beneficiary Email Address.

            Used only when accountIdentifier = 03.
          example: "customer@example.com"

        fpsId:
          type: string
          maxLength: 50
          description: |
            Beneficiary FPS ID.

            Used only when accountIdentifier = 04.
          example: "123456789"

        accountName:
          type: string
          description: 'Beneficiary Account Name. Mandatory for CHATS and for FPS when accountIdentifier = 01.'

        currency:
          $ref: '#/components/schemas/Currency'

        schemeName:
          $ref: '#/components/schemas/SchemeName'
          description: 'Scheme name. For BBAN accountIdentifier.'

    # --- Payment Identification ---
    PaymentIdentification:
      type: object
      description: Payment identification block.
      properties:
        endToEndId:
          type: string
          description: "End-to-end identifier assigned to the payment. For TT/FPS/CHATS, if not provided, recommend passing NOTPROVIDED."

    # --- Category Purpose ---
    CategoryPurpose:
      type: object
      description: "Category purpose of the payment (code or proprietary). TT optional. Use either code or proprietary, not both."
      properties:
        code:
          type: string
          description: Payment category code. TT optional.
        proprietary:
          type: string
          description: "Custom payment category. TT optional, mutually exclusive with code."

    # --- Purpose ---
    Purpose:
      type: object
      description: "Underlying reason for the payment (code or proprietary). TT optional. Use either code or proprietary, not both."
      properties:
        code:
          type: string
          description: Payment purpose code. TT optional.
        proprietary:
          type: string
          description: "Custom payment purpose. TT optional, mutually exclusive with code."

    # --- Creditor ---
    Creditor:
      type: object
      description: Party to whom payment is made (creditor).
      properties:
        creditorName:
          type: string
          description: "Creditor name in English. Max 140 characters."
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
        emailAddress:
          type: string
          description: Creditor email address.

    # --- Creditor Agent ---
    CreditorAgent:
      type: object
      description: "Creditor's financial institution."
      properties:
        financialInstitutionId:
          $ref: '#/components/schemas/FinancialInstitutionId'

    # --- Intermediary Agent ---
    IntermediaryAgent:
      type: object
      description: Intermediary agent involved in the payment.
      properties:
        financialInstitutionId:
          $ref: '#/components/schemas/FinancialInstitutionId'

    # --- Financial Institution ID ---
    FinancialInstitutionId:
      type: object
      description: "Financial institution identifiers (BIC / clearing code). BICFI and clearingSystemMemberId are mutually exclusive."
      properties:
        bicfi:
          type: string
          description: "Creditor bank SWIFT BIC Code. Mutually exclusive with clearingSystemMemberId."
        clearingSystemMemberId:
          type: string
          description: "Creditor bank Clearing Code. Mutually exclusive with bicfi."

    # --- Postal Address ---
    PostalAddress:
      type: object
      description: Postal address of the creditor.
      properties:
        addressLine1:
          type: string
          description: Creditor address line 1. TT required.
        addressLine2:
          type: string
          description: Creditor address line 2.
        townName:
          type: string
          description: Town / city name. TT required.
        country:
          type: string
          description: "Creditor country. ISO 2-letter country code. TT required."

    # --- Scheme Name ---
    SchemeName:
      type: object
      description: "FPS account type. HTH will map this to BBAN."
      properties:
        proprietary:
          type: string
          description: Proprietary scheme name.

    # --- Payment Transaction Search Schemas ---
    # --- Payment Enquiry Schemas ---
    PaymentTransaction:
      type: object
      description: |
        Payment transaction returned by the enquiry. Field set is common to On-Us
        (INTERNAL) and PayOut payments and is consistent with the corresponding BCO
        payment enquiry information.
      properties:
        referenceNumber:
          type: string
          maxLength: 50
          description: 'Payment transaction reference number (PAYMENT_ID) returned by the payment initiation API.'
          example: "HTH20260828120000123456"
        status:
          type: string
          maxLength: 10
          description: 'Latest transaction status.'
          enum: [ "Pending", "Processing", "Rejected", "Success" ]
          example: "Success"
        rejectMessage:
          type: string
          maxLength: 1000
          description: 'Rejection reason from the downstream system, when status = Rejected.'
          example: "ACCOUNT 0155211040961981 HKD DOES NOT EXISTS"
        asOf:
          type: string
          format: date-time
          description: Existing ISO 8601 date-time encoding; the V0.1 CHAR(13) representation requires confirmation.
        beneficiaryAccountName:
          type: string
          maxLength: 140
          description: 'Beneficiary Account Name. Recipient Details.'
          example: "REVAMP TESF"
        beneficiaryAccountNumber:
          type: string
          maxLength: 34
          description: 'Beneficiary Account Number. Recipient Details.'
          example: "01505216812024898"
        paymentType:
          type: string
          maxLength: 10
          description: 'Payment type.'
          enum: [ "CHATS", "INTERNAL", "FPS", "TT", "DR" ]
          example: "CHATS"
        executionDate:
          type: string
          format: date-time
          description: Existing ISO 8601 date-time encoding; the V0.1 CHAR(13) representation requires confirmation.
        transferAmount:
          type: number
          description: 'Payment amount; currency is returned separately in transferCurrency.'
          example: 5
        transferCurrency:
          type: string
          maxLength: 3
          description: 'Payment currency in ISO 4217.'
          example: "HKD"
        initiatedDate:
          type: string
          format: date-time
          description: Existing ISO 8601 date-time encoding; the V0.1 CHAR(13) representation requires confirmation.
        note:
          type: string
          maxLength: 140
          description: 'Stored payment description, when available.'
          example: "Invoice payment for services"
        remitterAccountNumber:
          type: string
          maxLength: 34
          description: 'Remitter Account Number.'
          example: "01516868006864"
        remitterAccountType:
          type: string
          maxLength: 3
          description: 'Remitter Account Type.'
          example: "CUR"
        remitterProductName:
          type: string
          maxLength: 140
          description: 'Remitter Product Name.'
          example: "Savings"
        remitterBank:
          type: string
          maxLength: 50
          description: 'Remitter Bank name.'
          example: "The Bank of East Asia Limited"
        remitterAccountCurrency:
          type: string
          maxLength: 3
          description: 'Payment currency in ISO 4217.'
          example: "HKD"
        externalReferenceId:
          type: string
          description: 'Existing END_TO_END_ID mapping retained; the V0.1 HTH-generated identifier definition requires confirmation.'
          example: "1f0ee48b-ce99-475f-8b72-52a7a492edfa"

    # --- Payment Response (Payment) ---
    PaymentResponse:
      type: object
      description: 'Common payment response returned for HTTP 200.'
      properties:
        status:
          type: string
          description: 'Status Code. Processing – In progress, Success – Completed, Rejected – Failed.'
          enum: ["Processing", "Success", "Rejected"]
          example: "Success"
        txnTime:
          type: string
          format: date-time
          description: ISO 8601 Date Formate.
        txnRef:
          type: string
          description: 'Transaction Reference.'
          example: "HTH20260727113727647063"
        rejectMessage:
          type: string
          description: 'Rejection message, when status = Rejected.'
          example: "INSUFFICIENT BALANCE"
        rejectCode:
          type: string
          description: 'Rejection code, when status = Rejected.'
          example: "600001"
        originalEndtoendID:
          type: string
          description: 'Original end-to-end ID.'
          example: "E2E123456"
        originalTransactionID:
          type: string
          description: 'Original transaction ID.'
          example: "TXN123456"
