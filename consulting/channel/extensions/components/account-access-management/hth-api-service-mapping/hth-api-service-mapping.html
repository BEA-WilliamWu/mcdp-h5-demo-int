<div class="form-main-container mapping-module">
    <div class="oj-sm-padding-2x-horizontal">
        <!-- ko ifnot: context.linkageType === 'ASSOCIATED' -->
        <page-section>
            <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]"
                label="[[nls.fieldname.userID]]" value="[[userIdDisplay]]">
            </obdx-row>
            <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]"
                label="[[nls.fieldname.userName]]" value="[[context.fullName || '-']]">
            </obdx-row>
        </page-section>
        <!-- /ko -->
        <!-- ko if: context.linkageType === 'ASSOCIATED' -->
        <page-section>
            <!-- Keep the BCO user/company layout inside one composite slot. -->
            <div>
                <div class="oj-flex oj-flex-items-pad oj-sm-align-items-center hth-associated-user-details">
                    <div class="oj-flex-item oj-sm-5 oj-md-5 oj-lg-5">
                        <div class="oj-flex oj-flex-items-pad">
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6">
                                <oj-label><span data-bind="text:nls.fieldname.userID"></span></oj-label>
                            </div>
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6">
                                <span data-bind="text:userIdDisplay"></span>
                            </div>
                        </div>
                    </div>
                    <div class="oj-flex-item oj-sm-2 oj-md-2 oj-lg-2">
                        <div class="oj-flex oj-flex-items-pad oj-sm-justify-content-center">
                            <img width="32" height="32" alt="" aria-hidden="true"
                                data-bind="loadImage:'cz/account-services/account-services.svg'">
                        </div>
                    </div>
                    <div class="oj-flex-item oj-sm-5 oj-md-5 oj-lg-5">
                        <div class="oj-flex oj-flex-items-pad">
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6">
                                <oj-label><span data-bind="text:nls.fieldname.linkedPartyName"></span></oj-label>
                            </div>
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6 word-break">
                                <span data-bind="text:context.accessPartyName || context.accessPartyId || '-'"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="oj-flex oj-flex-items-pad hth-associated-selected-user-details">
                    <div class="oj-flex-item oj-sm-12 oj-md-5 oj-lg-5">
                        <div class="oj-flex oj-flex-items-pad">
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6">
                                <oj-label><span data-bind="text:nls.fieldname.userName"></span></oj-label>
                            </div>
                            <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-6">
                                <span data-bind="text:context.fullName || '-'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </page-section>
        <!-- /ko -->
    </div>

    <div class="oj-sm-padding-2x-horizontal">
        <page-section heading="[[$component.nls.headers.hthApiMapping]]">
            <div class="oj-sm-12 word-break hth-api-instructions" data-bind="text: instructions"></div>

            <div data-bind="descendantsComplete: activateTab">
                <div id="hth-api-service-tabs">
                    <nav-bar class="oj-flex oj-flex-items-pad nav-bar-class" base-model="[[$baseModel]]"
                        menu-options="[[$component.tabLists]]"
                        nav-bar-description="[[nls.navLabels.navDescription]]"
                        menu-float="[[uiOptions.menuFloat]]" full-width="[[uiOptions.fullWidth]]"
                        default-option="{{uiOptions.defaultOption}}">
                    </nav-bar>
                </div>
            </div>

            <!-- ko if: isEditable -->
            <div class="oj-flex oj-flex-items-pad hth-api-copy-action">
                <oj-button class="action-button-secondary" on-click="[[$component.applyFirstToAll]]">
                    <span data-bind="text: nls.fieldname.hthApplyFirstToAll"></span>
                </oj-button>
            </div>
            <!-- /ko -->

            <div class="oj-flex oj-flex-items-pad table-data">
                <oj-table id="hthApiServiceTable" :aria-label="[[nls.headers.hthApiMapping]]"
                    columns="[[[
                        {headerText:nls.headers.AccountNumber,field:'accountNumber',style:'width:35%'},
                        {headerText:nls.headers.currency,field:'currency',style:'width:20%'},
                        {headerText:nls.headers.displayName,field:'displayName',style:'width:45%'}
                    ]]]" row-renderer="[[$oj.KnockoutTemplateUtils.getRenderer('hthApiServiceRow',true)]]"
                    data="[[accountDataSource]]">
                </oj-table>

                <script type="text/html" id="hthApiServiceRow">
                    <tr>
                        <!-- ko if: $context.rowContext.depth === 1 -->
                        <td>
                            <oj-row-expander context="[[$context.rowContext]]"></oj-row-expander>
                            <span data-bind="text:$context.row.accountNumberDisplay"></span>
                        </td>
                        <td><span data-bind="text:$context.row.displayCurrency"></span></td>
                        <td><span data-bind="text:$context.row.displayAccountType"></span></td>
                        <!-- /ko -->
                        <!-- ko if: $context.rowContext.depth === 2 -->
                        <td colspan="3" class="hth-api-row-contents">
                            <div class="hth-api-heading" data-bind="text:$component.nls.fieldname.apiServices"></div>
                            <div class="hth-api-grid" data-bind="foreach:$context.row.apiServices">
                                <label class="hth-api-option">
                                    <input type="checkbox"
                                        data-bind="checked:selected,enable:$component.isEditable">
                                    <span data-bind="text:apiName"></span>
                                </label>
                            </div>
                        </td>
                        <!-- /ko -->
                    </tr>
                </script>
            </div>
            <div class="hth-api-empty"
                data-bind="visible: noAccountsForActiveType(), text: nls.headers.noAccountsAvailable"></div>
        </page-section>
    </div>

    <div class="oj-flex oj-flex-items-pad button-container">
        <!-- ko ifnot: isEditable -->
        <oj-button class="action-button-primary" on-click="[[$component.edit]]"><span data-bind="text: nls.headers.edit"></span></oj-button>
        <!-- /ko -->
        <!-- ko if: isEditable -->
        <oj-button class="action-button-primary" on-click="[[$component.save]]"><span data-bind="text: nls.common.save"></span></oj-button>
        <!-- /ko -->
        <oj-button class="action-button-secondary" on-click="[[$component.cancel]]"><span data-bind="text: nls.common.cancel"></span></oj-button>
        <oj-button class="action-button-tertiary" on-click="[[$component.back]]"><span data-bind="text: nls.common.back"></span></oj-button>
    </div>
</div>
