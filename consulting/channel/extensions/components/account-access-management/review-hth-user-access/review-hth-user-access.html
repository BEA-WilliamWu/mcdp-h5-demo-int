<div class="form-main-container">
    <!-- ko ifnot: approvalMode -->
    <div data-bind="template: { name: 'review-screen/review-banner-template', data: { header: nls.navLabels.review, reviewHeader: nls.info.hthReviewMessage } }"></div>
    <!-- /ko -->
    <page-section>
        <div class="oj-flex oj-flex-items-pad">
            <div class="oj-flex-item oj-sm-4"><label data-bind="text: nls.fieldname.userID"></label></div>
            <div class="oj-flex-item oj-sm-8"><span data-bind="text: access.username || access.closeId"></span></div>
        </div>
        <div class="oj-flex oj-flex-items-pad">
            <div class="oj-flex-item oj-sm-4"><label data-bind="text: nls.fieldname.companyName"></label></div>
            <div class="oj-flex-item oj-sm-8"><span data-bind="text: access.accessPartyName || access.accessPartyId"></span></div>
        </div>
    </page-section>
    <!-- ko if: isDelete -->
    <div class="hth-review-delete" data-bind="text: nls.info.hthDeleteWarning"></div>
    <!-- /ko -->
    <!-- ko ifnot: isDelete -->
    <page-section heading="[[$component.nls.headers.hthReviewMapping]]">
        <div class="hth-review-instructions" data-bind="text: nls.notes.UAC05_REVIEW"></div>
        <div class="hth-account-tabs" role="tablist">
            <button type="button" role="tab"
                data-bind="click: showCurrentAndSavings,
                    css: { 'hth-account-tab-active': activeAccountType() === 'CSA' },
                    attr: { 'aria-selected': activeAccountType() === 'CSA' }">
                <span data-bind="text: nls.navLabels.CASA"></span>
            </button>
            <button type="button" role="tab"
                data-bind="click: showTimeDeposits,
                    css: { 'hth-account-tab-active': activeAccountType() === 'TD' },
                    attr: { 'aria-selected': activeAccountType() === 'TD' }">
                <span data-bind="text: nls.navLabels.TD"></span>
            </button>
        </div>
        <div class="hth-review-account-header">
            <span class="hth-review-selection"></span>
            <span data-bind="text: nls.headers.AccountNumber"></span>
            <span data-bind="text: nls.headers.currency"></span>
            <span data-bind="text: nls.headers.displayName"></span>
        </div>
        <!-- ko foreach: filteredAccounts -->
        <details class="hth-review-account" open>
            <summary>
                <span class="hth-review-account-row">
                    <span class="hth-review-selection">
                        <input type="checkbox" checked disabled>
                    </span>
                    <span data-bind="text: accountNumberDisplay"></span>
                    <span data-bind="text: displayCurrency"></span>
                    <span data-bind="text: displayAccountType"></span>
                </span>
            </summary>
            <div class="hth-review-api-heading" data-bind="text: $component.nls.fieldname.apiServices"></div>
            <div class="hth-review-api-grid" data-bind="foreach: $component.selectedApis($data)">
                <label class="hth-review-api">
                    <input type="checkbox" checked disabled>
                    <span data-bind="text: apiName"></span>
                </label>
            </div>
        </details>
        <!-- /ko -->
        <div class="hth-review-empty"
            data-bind="visible: noAccountsForActiveType(), text: nls.headers.noAccountsAvailable"></div>
    </page-section>
    <!-- /ko -->
    <!-- ko ifnot: approvalMode -->
    <div class="button-container">
        <oj-button class="action-button-primary" on-click="[[$component.confirm]]" disabled="[[$component.isSubmitting]]"><span data-bind="text: nls.common.confirm"></span></oj-button>
        <oj-button class="action-button-secondary" on-click="[[$component.cancel]]"><span data-bind="text: nls.common.cancel"></span></oj-button>
        <oj-button class="action-button-tertiary" on-click="[[$component.back]]"><span data-bind="text: nls.common.back"></span></oj-button>
    </div>
    <!-- /ko -->
</div>
