<div class="hth-api-password-page" data-bind="css: {'hth-api-password-page--reset': !isSetup}">
    <!-- ko if: !showConfirmation() -->
    <oj-validation-group id="hthApiPasswordTracker">
        <div class="oj-flex oj-flex-items-pad">
            <div class="oj-flex-item oj-sm-12"
                data-bind="css: { 'oj-md-7 oj-lg-7': isSetup, 'oj-md-12 oj-lg-12': !isSetup }">
                <h2 data-bind="text: isSetup ? nls.setupHeader : nls.resetHeader"></h2>
                <p data-bind="text:nls.description"></p>
                <oj-form-layout label-edge="top" max-columns="1" direction="row">
                    <oj-input-password id="hthApiNewPassword" autocomplete="new-password"
                        label-hint="[[nls.newPassword]]" value="{{newPassword}}" required="true"
                        disabled="[[submitting]]"></oj-input-password>
                    <oj-input-password id="hthApiConfirmPassword" autocomplete="new-password"
                        label-hint="[[nls.confirmPassword]]" value="{{confirmPassword}}" required="true"
                        disabled="[[submitting]]"></oj-input-password>
                    <oj-input-password id="hthApiPasswordCode" autocomplete="one-time-code"
                        label-hint="[[nls.passwordCode]]" value="{{passwordCode}}" required="true"
                        disabled="[[submitting]]"></oj-input-password>
                    <p class="code-help" data-bind="text:nls.codeHelp"></p>
                    <div class="button-container">
                        <oj-button class="action-button-primary" on-click="[[submit]]"
                            disabled="[[submitting]]">
                            <span data-bind="text:nls.submit"></span>
                        </oj-button>
                        <oj-button class="action-button-secondary" on-click="[[cancel]]"
                            disabled="[[submitting]]">
                            <span data-bind="text:nls.cancel"></span>
                        </oj-button>
                    </div>
                </oj-form-layout>
            </div>
            <!-- ko if: isSetup -->
            <div class="oj-flex-item oj-sm-12 oj-md-5 oj-lg-5 policy-panel">
                <h3 data-bind="text:nls.policyHeader"></h3>
                <ul>
                    <li data-bind="text:nls.policyLength"></li>
                    <li data-bind="text:nls.policyAlphaNumeric"></li>
                    <li data-bind="text:nls.policyNumbers"></li>
                    <li data-bind="text:nls.policySpecial"></li>
                </ul>
            </div>
            <!-- /ko -->
        </div>
    </oj-validation-group>
    <!-- /ko -->
    <!-- ko if: showConfirmation() -->
    <div class="confirmation-panel">
        <h2 data-bind="text:nls.confirmationHeader"></h2>
        <p data-bind="text: isSetup ? nls.setupSuccess : nls.resetSuccess"></p>
        <oj-button class="action-button-primary" on-click="[[goToDashboard]]">
            <span data-bind="text:nls.goToDashboard"></span>
        </oj-button>
    </div>
    <!-- /ko -->
</div>
