      <div class="oj-flex oj-flex-items-pad button-container">
        <oj-button id="backYes" class="action-button-primary" on-click="[[$component.confirmDisableLoginPINResetCodeStatus]]">
          <span data-bind="text:$component.nls.common.confirm"></span>
        </oj-button>
        <oj-button id="backNo" class="action-button-secondary" on-click="[[$component.cancelDisableLoginPINResetCodeStatus]]">

    </div>
