<!-- ko let: {$dashboard : getDashboardContext(), $oj: oj, $baseModel: $properties.baseModel, $formatter: $properties.formatter, $root: $properties.rootModel}-->
<div class="dashboard">
    <a class="skip-main" href="#maincontent" tabindex="0" data-bind="text:locale.skipToMainContent"></a>
    <div class="oj-offcanvas-outer-wrapper oj-offcanvas-page">
        <nav class="main-menu oj-offcanvas-start" id="innerDrawer">
            <obdx-menu root-model="[[$properties.rootModel]]" base-model="[[$properties.baseModel]]"
                dashboard="{{$dashboard}}" formatter="[[$properties.formatter]]"
                compute-context="[[$properties.rootModel.computeContext]]" menu-option-select="[[menuOptionSelect]]"
                change-menu-state="[[changeMenuState]]" filter-menu="[[filterMenu]]">
            </obdx-menu>
        </nav>
        <div id="endDrawer" class="right-overlay-panel oj-offcanvas-end oj-offcanvas-overlay-shadow">
            <!-- ko if : rightPanelData.isOpen() -->
            <div class="oj-flex overlayHeader">
                <h3 class="oj-flex-item oj-sm-10 headerTxt text-normal" data-bind="text: rightPanelData.header"></h3>
                <a class="oj-flex-item oj-sm-2" href="#"
                    data-bind="click: rightPanelData.closeHandler, attr:{alt: locale.overlayDismiss, title: locale.overlayDismissTitle }">
                    <span class="icons icon-cross pull-right small-icon"></span>
                </a>
            </div>
            <div id="rightPanelBody" class="oj-flex overlayBody form-main-container">
                <oj-bind-if test="[[!rightPanelData.cca]]">
                    <div
                        data-bind="component: {name:rightPanelData.componentName , params:{rootModel:rightPanelData.data, closeHandler : rightPanelData.closeHandler }}">
                    </div>
                </oj-bind-if>
            </div>
            <!-- /ko -->
        </div>
        <div class="main-container">
            <header>
                <obdx-header root-model="{{$properties.rootModel}}" base-model="[[$properties.baseModel]]"
                    dashboard="{{$dashboard}}" formatter="[[$properties.formatter]]"
                    compute-context="{{$properties.rootModel.computeContext}}" change-menu-state="[[changeMenuState]]"
                    menu-option-select="[[menuOptionSelect]]" filter-menu="[[filterMenu]]">
                </obdx-header>
            </header>
            <main class="container" id="maincontent" tabindex="-1">
                <!-- ko if: showHeaderNotification() -->
                <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                    style="background: #fff1db !important; padding: 12px 16px;"
                    bea-id="txt_addBeneficiary_NotificationMessage">
                    <div class="oj-flex oj-sm-12 warning-text">
                        <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'icon-upload-warnning.svg'" src="./images/icon-upload-warnning.svg" loading="lazy" alt=""></span>
                        <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                            <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.warningHeader"></h4>
                            <div class="review-banner-content__message" style="color: #333333;">
                                <span data-bind="text: locale.addBeneficiary.warningContent"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
                <!-- ko if: showPayeeDetailsTownNotification() -->
                <!-- ko if: $dashboard.appData.segment === 'CORPADMIN' -->
                    <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                        style="background: #FBECEB !important; padding: 12px 16px;"
                        bea-id="txt_addBeneficiary_NotificationMessage">
                        <div class="oj-flex oj-sm-12 warning-text">
                            <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'icon-warning-error.svg'" src="./images/icon-warning-error.svg" loading="lazy" alt=""></span>
                            <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                                <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.predesignatedHeader"></h4>
                                <div class="review-banner-content__message" style="color: #333333;">
                                    <span data-bind="text: locale.addBeneficiary.payeeDetailsTownContent"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- /ko -->
                <!-- ko ifnot: $dashboard.appData.segment === 'CORPADMIN' -->
                    <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                        style="background: #FBECEB !important; max-width: 80rem; margin: 0 auto; margin-top: 22px;"
                        bea-id="txt_addBeneficiary_NotificationMessage">
                        <div class="oj-flex oj-sm-12 warning-text">
                            <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'icon-warning-error.svg'" src="./images/icon-warning-error.svg" loading="lazy" alt=""></span>
                            <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                                <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.predesignatedHeader" style="margin: 0; padding-left: 0; padding-bottom: 0;"></h4>
                                <div class="review-banner-content__message" style="color: #333333; padding-left: 0;">
                                    <span data-bind="text: locale.addBeneficiary.payeeDetailsTownContent"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- /ko -->
                <!-- /ko -->
                <!-- ko if: showPayeeDetailsNotification() -->
                <!-- ko if: $dashboard.appData.segment === 'CORPADMIN' -->
                    <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                        style="background: #FBECEB !important; padding: 12px 16px;"
                        bea-id="txt_addBeneficiary_NotificationMessage">
                        <div class="oj-flex oj-sm-12 warning-text">
                            <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'icon-warning-error.svg'" src="./images/icon-warning-error.svg" loading="lazy" alt=""></span>
                            <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                                <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.payeeDetailsHeader"></h4>
                                <div class="review-banner-content__message" style="color: #333333;">
                                    <span data-bind="text: locale.addBeneficiary.payeeDetailsContent"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- /ko -->
                <!-- ko ifnot: $dashboard.appData.segment === 'CORPADMIN' -->
                    <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                        style="background: #FBECEB !important; max-width: 80rem; margin: 0 auto; margin-top: 22px;"
                        bea-id="txt_addBeneficiary_NotificationMessage">
                        <div class="oj-flex oj-sm-12 warning-text">
                            <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'icon-warning-error.svg'" src="./images/icon-warning-error.svg" loading="lazy" alt=""></span>
                            <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                                <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.payeeDetailsHeader" style="margin: 0; padding-left: 0; padding-bottom: 0;"></h4>
                                <div class="review-banner-content__message" style="color: #333333; padding-left: 0;">
                                    <span data-bind="text: locale.addBeneficiary.payeeDetailsContent"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- /ko -->
                <!-- /ko -->
                <!-- ko if: showPredesignatedNotification() -->
                <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                    style="background: #fff1db !important; padding: 12px 16px;"
                    bea-id="txt_addBeneficiary_NotificationMessage">
                    <div class="oj-flex oj-sm-12 warning-text">
                        <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'warming-icon-orange.svg'" src="./images/icon-upload-error.svg" loading="lazy" alt=""></span>
                        <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                            <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.predesignatedHeader"></h4>
                            <div class="review-banner-content__message" style="color: #333333;">
                                <span data-bind="text: locale.addBeneficiary.predesignatedContent"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
                <!-- ko if: showPredesignatedTownNotification() -->
                <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                    style="background: #fff1db !important; padding: 12px 16px;"
                    bea-id="txt_addBeneficiary_NotificationMessage">
                    <div class="oj-flex oj-sm-12 warning-text">
                        <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'warming-icon-orange.svg'" src="./images/icon-upload-error.svg" loading="lazy" alt=""></span>
                        <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                            <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.predesignatedHeader"></h4>
                            <div class="review-banner-content__message" style="color: #333333;">
                                <span data-bind="text: locale.addBeneficiary.predesignatedTownContent"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
                <!-- ko if: showFavTownNotification() -->
                <div id="warning-container" class="oj-flex oj-flex-items-pad warning-container"
                    style="background: #fff1db !important; padding: 12px 16px;"
                    bea-id="txt_addBeneficiary_NotificationMessage">
                    <div class="oj-flex oj-sm-12 warning-text">
                        <span class="oj-flex oj-sm-align-self-center review-banner__image"><img data-bind="loadImage:'warming-icon-orange.svg'" src="./images/icon-upload-error.svg" loading="lazy" alt=""></span>
                        <div class="oj-flex-item oj-sm-11 oj-lg-11 oj-md-11 review-banner__content review-banner-content">
                            <h4 class="review-banner-content__header" data-bind="text: locale.addBeneficiary.predesignatedHeader"></h4>
                            <div class="review-banner-content__message" style="color: #333333;">
                                <span data-bind="text: locale.addBeneficiary.FavTownContent"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
                <div data-bind="template: {name:'dashboard-heading'}"></div>
                <!-- ko if: componentReset() && router.currentValue() && router.currentValue().isDashboard -->
                <dashboard-container id="dbContainer" root-model="[[$properties.rootModel]]"
                    base-model="[[$properties.baseModel]]" dashboard="{{$dashboard}}"
                    formatter="[[$properties.formatter]]" dashboard-name="[[router.currentValue().dashboard]]"
                    menu-option-select="[[menuOptionSelect]]" filter-menu="[[filterMenu]]"
                    warnings-dismissed="[[warningsDismissed]]" compute-context="{{$properties.rootModel.computeContext}}" dismiss-warnings="[[dismissWarnings]]" data-oj-context>
                </dashboard-container>
                <!-- /ko -->
                <div data-bind="css : {'main-content' : !isLogin() && !isDashboard()}">
                    <div class="oj-flex">
                        <!-- ko if: componentReset() && router.currentValue() && router.currentValue().component -->
                        <!-- ko if: router.currentValue().component() === "manage-accounts"-->
                        <manage-accounts class="oj-flex-item oj-sm-12 form-main-container" id="appShellManageAccounts"
                            dashboard=[[$dashboard]] base-model=[[$properties.baseModel]]
                            root-model="[[router.currentValue()]]" formatter="[[$properties.formatter]]"
                            data-oj-context>
                        </manage-accounts>
                        <!-- /ko -->
                        <!-- ko if: router.currentValue().component() !== "manage-accounts"-->
                            <div class="oj-flex-item oj-sm-12"
                                data-bind="childrenComplete: targetLoaded, component: {name:router.currentValue().component, params:{rootModel:router.currentValue()}}, class: isDashboard() ? '' : router.currentValue().component() === 'merchant-login-form' ? 'main-content' : headerName() || headerCaption() ? 'form-main-container' : 'form-main-container-border'">
                            </div>
                        <!-- /ko -->
                        <!-- /ko -->
                        <!-- ko if:$properties.baseModel.onTFAScreen() -->
                        <div id="generic-authentication" class="oj-flex-item oj-sm-12"
                            data-bind="component: {name : 'generic-authentication', params:{rootModel: $properties.baseModel.authViewModel}}">
                        </div>
                        <!-- /ko -->
                    </div>
                </div>
            </main>
            <offline-notification base-model="[[$properties.baseModel]]" formatter="[[$properties.formatter]]">
            </offline-notification>
            <footer>
                <!-- ko if: fabRequired() && (!$properties.baseModel.large() || $baseModel.cordovaDevice()) && $properties.rootModel.isUserDataSet() && ($dashboard.appData.segment ==="RETAIL" || $dashboard.appData.segment ==="CORP") -->
                <!-- ko if: $properties.rootModel.menuNavigationAvailable && isDashboard() -->
                <!-- <docked-menu base-model="[[$properties.baseModel]]" dashboard="[[$dashboard]]"
                    formatter="[[$properties.formatter]]">
                </docked-menu> -->
                <!-- /ko -->
                <!-- /ko -->
                <!-- ko ifnot: $properties.baseModel.cordovaDevice() -->
                <!-- ko ifnot: $properties.rootModel.isUserDataSet() && ($dashboard.appData.segment ==="RETAIL") -->
                <obdx-footer root-model="[[$properties.rootModel]]"
                base-model="[[$properties.baseModel]]" dashboard="{{$dashboard}}" ></obdx-footer>
                <!-- /ko -->
                <!-- /ko -->
            </footer>
        </div>
        <!-- ko if:!isDashboard() && !$properties.baseModel.small() -->
        <div class="back-top">
            <a href="#"
                data-bind="click: backTop, attr:{'alt':locale.backTop ,'aria-label':locale.backTop, 'title':locale.backTop}">
                <span class="icons icon-arrow-up"></span>
            </a>
        </div>
        <!-- /ko -->
    </div>
    <!-- ko if: modalComponent() -->
    <div data-bind="descendantsComplete: targetLoaded, component: {name:modalComponent , params:{rootModel: $data}}">
    </div>
    <!-- /ko -->
    <!-- ko if: oracleLiveComponent() && $properties.baseModel.large() -->
    <div data-bind="component: {name: oracleLiveComponent(), params:{ rootModel: $data }}"></div>
    <!-- /ko -->
    <!-- ko if: isDashboard() && $properties.rootModel.isUserDataSet() && $dashboard.userData.userProfile.rewardsEnabled -->
    <a href="#"
        data-bind="click: $dashboard.openRightPanel.bind(null, 'rewards', {}, locale.rewards, null), attr:{'alt':locale.rewardsTitle,'title':locale.rewardsTitle}">
        <div class="floating-button rewards-widget"><span slot="startIcon" class="icons icon-offers"></span></div>
    </a>
    <!-- /ko -->
</div>
<modal-window class="oj-flex oj-flex-items-pad message" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['sessionExpired']]" header="[[locale.sessionExpiredHeader]]"
    close-handler="[[sessionExpiredHandler]]">
    <div>
        <div class="oj-flex-item message-text label scroll" data-bind="text:locale.sessionExpired"></div>
        <div class="message-btn button-container">
            <oj-button id="sessionExpiredButton" class="action-button-primary" on-click="[[sessionExpiredHandler]]">
                <span data-bind="text:locale.generic.common.ok"></span>
            </oj-button>
        </div>
    </div>
</modal-window>
<modal-window class="oj-flex oj-flex-items-pad message" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['passwordDialog']]" header="[[locale.passwordNotification]]">
    <div>
        <div class="oj-flex oj-flex-items-pad">
            <div class="oj-flex-item">
                <span data-bind="text: locale.passCombination"></span>
            </div>
        </div>
        <div class="oj-flex oj-flex-items-pad">
            <div class="oj-flex-item">
                <span data-bind="text: locale.passwordExample"></span>
            </div>
        </div>
    </div>
</modal-window>

<modal-window class="oj-flex oj-flex-items-pad message pin-change-reminder" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['changePinDialog']]" header="[[locale.pinChangeReminder.popupHeader]]"
    close-handler="[[pinReminderCancel]]">
    <div class="modal-body">
        <div class="oj-flex-item message-text label scroll" data-bind="text:locale.pinChangeReminder.description"></div>
        <div class="oj-flex-item message-text label scroll question" data-bind="text:locale.pinChangeReminder.question"></div>

        <oj-radioset class="options" :id="[['remindOptions']]" value="{{pinReminder}}" required>
              <!-- ko foreach : changePinReminderOptions -->
               <oj-option value="{{$data.value}}"><span data-bind="text:$data.label"></span>
               </oj-option>
               <!-- /ko -->
        </oj-radioset>

        <div class="message-btn button-container">
            <oj-button id="pinReminderCancelButton" class="action-button-secondary" on-click=[[pinReminderCancel]]>
                <span data-bind="text:locale.generic.common.cancel"></span>
            </oj-button>
            <oj-button id="pinReminderNextButton" class="action-button-primary" disabled="[[pinReminderNextDisabled]]" on-click=[[pinReminderNext]]>
                <span data-bind="text:locale.generic.common.next"></span>
            </oj-button>
        </div>
    </div>
</modal-window>

<modal-window class="oj-flex oj-flex-items-pad message pin-change-reminder" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['changeSignerPinDialog']]" header="[[locale.signerPinChangeReminder.popupHeader]]"
    close-handler="[[signerPinReminderCancel]]">
    <div class="modal-body">
        <div class="oj-flex-item message-text label scroll" data-bind="text:locale.signerPinChangeReminder.description"></div>
        <div class="oj-flex-item message-text label scroll question" data-bind="text:locale.signerPinChangeReminder.question"></div>

        <oj-radioset class="options" :id="[['remindOptions']]" value="{{signerPinReminder}}" required>
              <!-- ko foreach : changeSignerPinReminderOptions -->
               <oj-option value="{{$data.value}}"><span data-bind="text:$data.label"></span>
               </oj-option>
               <!-- /ko -->
        </oj-radioset>

        <div class="message-btn button-container">
            <oj-button id="pinReminderCancelButton" class="action-button-secondary" on-click=[[signerPinReminderCancel]]>
                <span data-bind="text:locale.generic.common.cancel"></span>
            </oj-button>
            <oj-button id="pinReminderNextButton" class="action-button-primary" disabled="[[signerPinReminderDisabled]]" on-click=[[signerPinReminderNext]]>
                <span data-bind="text:locale.generic.common.next"></span>
            </oj-button>
        </div>
    </div>
</modal-window>

<modal-window class="oj-flex oj-flex-items-pad message" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['bounceBackDialog']]" header="[[locale.bounceBackReminder.popupHeader]]"
    close-handler="[[closeBounceBackReminder]]">
    <div class="modal-body">
        <!-- ko if : bounceBackReminderType() === 'user' -->
        <div class="oj-flex-item message-text label scroll" data-bind="text:locale.bounceBackReminder.usersDesc"></div>
        <!-- /ko -->
        <!-- ko if : bounceBackReminderType() === 'ap' -->
        <div class="oj-flex-item message-text label scroll" data-bind="text:locale.bounceBackReminder.authPersonDesc"></div>
        <!-- /ko -->
        <div class="oj-flex-item message-text label scroll question" data-bind="text:locale.bounceBackReminder.subDesc"></div>

        <div class="message-btn button-container">
            <oj-button id="bounceBackReminderYesButton" class="action-button-primary" on-click=[[closeBounceBackReminder]]>
                <span data-bind="text:locale.generic.common.yes"></span>
            </oj-button>
            <oj-button id="bounceBackReminderNoButton" class="action-button-secondary" on-click=[[updateBounceBackReminder]]>
                <span data-bind="text:locale.generic.common.no"></span>
            </oj-button>
        </div>
    </div>
</modal-window>

<modal-window class="oj-flex oj-flex-items-pad message" base-model="[[$properties.baseModel]]"
    dashboard="[[$dashboard]]" dialog-id="[['hthApiPasswordSetupDialog']]"
    header="[[locale.hthApiPasswordSetup.popupHeader]]"
    close-handler="[[dismissHthApiPasswordSetup]]">
    <div class="modal-body">
        <div class="oj-flex-item message-text label scroll"
            data-bind="text: hthApiPasswordSetupState() === 'CODE_REQUIRED'
                ? locale.hthApiPasswordSetup.codeRequired : locale.hthApiPasswordSetup.description"></div>
        <div class="oj-flex-item message-text label scroll question"
            data-bind="text:locale.hthApiPasswordSetup.question"></div>
        <div class="message-btn button-container">
            <oj-button class="action-button-secondary" on-click="[[dismissHthApiPasswordSetup]]">
                <span data-bind="text:locale.generic.common.cancel"></span>
            </oj-button>
            <oj-button class="action-button-primary" on-click="[[openHthApiPasswordSetup]]"
                disabled="[[hthApiPasswordSetupState() !== 'REQUIRED']]">
                <span data-bind="text:locale.generic.common.next"></span>
            </oj-button>
        </div>
    </div>
</modal-window>

<div data-bind="component: {name:'session-timeout', params:{rootModel: $properties.rootModel}}"> </div>

<!-- /ko -->
