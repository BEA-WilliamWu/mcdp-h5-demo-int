<!-- ko if: hthPageAllowed -->
<div class="form-main-container">

  <!-- ko if: $component.transactionId === undefined -->
  <div
    data-bind="template: { name: 'review-screen/review-banner-template', data: {header : $component.nls.generic.common.review , reviewHeader :$component.nls.info.lockStatusReviewHeaderMsg}}">
  </div> <!-- /ko -->
  <page-section>
    <div>

      <!-- ko if : dataLoaded -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.fullName]]"
        value="[[$baseModel.format($component.nls.fieldname.displayFullName, {firstname:searchedResultResponse().firstName, lastname: searchedResultResponse().lastName})]]">
      </obdx-row>

      <!-- ko ifnot : isCorpAdmin -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.email]]"
        value="[[searchedResultResponse().emailId]]">
      </obdx-row>
      <!-- ko if : mobileflag -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.mobNumber]]"
        value="[[$baseModel.format($component.nls.fieldname.mobileWithCode, {code:userExtensionData().mobileCode, mobileNo:searchedResultResponse().mobileNumber})]]">
      </obdx-row>
      <!-- /ko -->
      <!-- /ko -->

      <!-- ko if : isCorpAdmin -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.email]]"
        value="[[$component.userExtensionData().maskedEmailId]]" data-class="[['word-break-all']]">
      </obdx-row>

      <!-- ko if : mobileflag -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.mobNumber]]"
        value="[[$component.userExtensionData().maskedMobileNo]]">
      </obdx-row>
      <!-- /ko -->
      <!-- /ko -->

      <!-- ko if: $component.searchedResultResponse().partyId -->

      <!-- ko if: $component.searchedResultResponse().partyId.value !== null && $component.searchedResultResponse().partyId.value !== "" -->
      <obdx-row base-model="[[$baseModel]]" dashboard="[[$dashboard]]" label="[[$component.nls.fieldname.partyId]]"
        value="[[searchedResultResponse().partyId.displayValue]]">
      </obdx-row> <!-- /ko -->
      <!-- /ko -->
      <div class="oj-flex oj-flex-items-pad">
        <div class="oj-flex-item oj-sm-12 oj-md-4 oj-lg-3">
          <oj-label for="lockstatus">
            <span data-bind="text:$component.nls.header.status"></span></oj-label>
        </div>
        <div class="oj-flex-item oj-sm-12 oj-md-8 oj-lg-8" style="display: inline-flex;align-items: stretch;">
          <oj-switch id="lockstatus" value="{{$component.reviewstatusOptionValue}}" disabled="[[true]]">
          </oj-switch>
          <!-- ko if : isCorpAdmin -->
          <span data-bind="text:  $component.lockStatusValue()" style="margin-top: 16px;"></span>
          <!-- /ko -->
            <!-- ko ifnot : isCorpAdmin -->
             <span data-bind="text:  $component.lockStatusValue()" style="margin-top: 10px;"></span>
          <!-- /ko -->
        </div>
      </div>
      <div class="oj-flex oj-flex-items-pad">
        <div class="oj-flex-item oj-sm-12 oj-md-4 oj-lg-3">
          <oj-label for="lockstatus">
            <span data-bind="text:$component.nls.header.reason"></span></oj-label>
        </div>
        <div class="oj-flex-item oj-sm-12 oj-md-8 oj-lg-8">
          <span data-bind="text:  $component.lockReason()"></span>
        </div>
      </div>
      <!-- /ko -->
    </div>
  </page-section>

  <!-- ko if: $component.transactionId === undefined -->
  <div class="oj-flex button-container">
    <oj-button id="submit" class="action-button-primary" on-click="[[$component.confirm]]">
      <span data-bind="text:$component.nls.buttons.confirm"></span>
    </oj-button>
    <oj-button id="cancel" class="action-button-secondary" on-click="[[$dashboard.switchModule.bind($data,true)]]">
      <span data-bind="text:$component.nls.buttons.cancel"></span>
    </oj-button>
    <oj-button id="back" class="action-button-tertiary" on-click="[[$component.back]]">
      <span data-bind="text:$component.nls.buttons.back"></span>
    </oj-button>
  </div> <!-- /ko -->
</div>
<!-- /ko -->
