<div class="oj-flex-item oj-sm-12 oj-md-15 oj-lg-15 windowleft">

  <!-- ko if: userListLoaded  -->
  <page-section heading="[[nls.header.userList]]">
    <div>
      <oj-table :aria-label="[[$component.nls.header.details]]" columns="[[[{headerText:nls.header.initials,field:'name',style:'width: 10%'},{headerText:nls.header.userName,style:'width: 20%',field:'emailId'},{headerText:nls.header.fullName,style:'width: 30%',field:'firstName'},{headerText:nls.header.mapping,style:'width: 20%',field:'lastName'},{headerText:nls.header.userChannelType,style:'width: 20%',field:'userChannelType'}]]]" columns-default="[[{sortable:'enabled'}]]" selection-mode="[[{row:'multiple',column:'multiple'}]]" row-renderer="[[$oj.KnockoutTemplateUtils.getRenderer('userlist_template', true)]]" data="[[userListDetailsDataSource]]">
      </oj-table>
      <script type="text/html" id="userlist_template">
        <tr class="record">
          <td>
            <div class="user-initials" data-bind="text:$component.placeInitials(firstName,lastName)"></div>
          </td>
          <td><a href="#" data-bind="text:username.split('@')[0],click:$component.showUserAccountAccess.bind($data)"></a>
          </td>
          <td>
            <span data-bind="text:$baseModel.format($component.nls.generic.common.name,{firstName:firstName,lastName:lastName})"></span>
          </td>
          </td>

          <!-- ko if:!accountAccessSetupDone -->
          <td>
            <span class="icons icon-maintenance"></span>

            <!-- <img class="profile" data-bind="loadImage:'admin/common/maintenance.svg' " /> -->
          </td> <!-- /ko -->

          <!-- ko if:accountAccessSetupDone -->
          <td>
            <div id="success-icon">
              <span class="icons icon-success"></span></div>

            <!-- <img class="profile" data-bind="loadImage:'admin/common/confirmation.png' " /> -->
          </td> <!-- /ko -->
          <td>
            <span data-bind="text:userChannelType"></span>
          </td>
        </tr>
      </script>
    </div>
  </page-section> <!-- /ko -->
</div>
