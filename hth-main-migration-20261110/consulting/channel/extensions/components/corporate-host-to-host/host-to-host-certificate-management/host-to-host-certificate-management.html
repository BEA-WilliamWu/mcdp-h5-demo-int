<!-- ko ifnot: $component.isSuccessMode() -->
<div class="oj-flex hth-certificate-screen"
     data-bind="css: { 'hth-certificate-approval-screen': $component.approvalMode() }">
    <div class="oj-flex-item oj-sm-12 oj-md-8 oj-lg-8 hth-certificate-main-panel">
        <div class="hth-certificate-fields">
            <obdx-row base-model="[[$baseModel]]"
                      dashboard="[[$dashboard]]"
                      label="[[$component.nls.labels.accountNumber]]"
                      value="[[$component.accountNumberDisplay]]"></obdx-row>
            <obdx-row base-model="[[$baseModel]]"
                      dashboard="[[$dashboard]]"
                      label="[[$component.nls.labels.companyName]]"
                      value="[[$component.companyNameDisplay]]"></obdx-row>

            <div class="oj-flex oj-flex-items-pad hth-certificate-upload-row">
                <div class="oj-flex-item oj-sm-12 oj-md-12 oj-lg-12 label">
                    <oj-label for="corporatePublicCertificateUpload">
                        <span data-bind="text: $component.nls.labels.certificateUpload"></span>
                        <span class="info-text-small" data-bind="text: $component.nls.labels.pemFormatOnly"></span>
                    </oj-label>
                </div>
                <div class="oj-flex-item oj-sm-12 oj-md-12 oj-lg-12 hth-certificate-upload-field">
                    <!-- ko if: $component.isReadMode() -->
                    <!-- ko foreach: $component.currentCertificateFiles -->
                    <div>
                        <a href="#"
                           class="form-button-link"
                           data-bind="text: name, click: $component.onDownloadCertificate"></a>
                        <a href="#"
                           class="form-button-link hth-certificate-download-link"
                           data-bind="attr: { 'aria-label': $component.nls.labels.downloadCertificate, title: $component.nls.labels.downloadCertificate }, click: $component.onDownloadCertificate">
                            <span class="icons icon-download"></span>
                        </a>
                    </div>
                    <!-- /ko -->
                    <!-- /ko -->

                    <!-- ko if: $component.isEditMode() -->
                    <!-- ko ifnot: $component.isUploadLimitReached() -->
                    <!-- ko if: $component.filePickerVisible() -->
                    <oj-file-picker id="corporatePublicCertificateUpload"
                                    class="oj-filepicker-custom hth-certificate-upload-picker"
                                    selection-mode="multiple"
                                    selecton="click"
                                    accept="[[$component.acceptedFileTypes]]"
                                    on-oj-select="[[$component.onFileSelect]]"
                                    on-oj-invalid-select="[[$component.onInvalidFile]]">
                        <oj-button slot="trigger"
                                   class="action-button-secondary"
                                   :aria-label="[[$component.nls.labels.chooseFiles]]"
                                   :title="[[$component.nls.labels.chooseFiles]]">
                            <span slot="startIcon"
                                  class="icons icon-upload hth-certificate-upload-icon"></span>
                            <span data-bind="text: $component.chooseFilesLabel"></span>
                        </oj-button>
                    </oj-file-picker>
                    <!-- /ko -->
                    <!-- /ko -->

                    <!-- ko foreach: $component.uploadedFiles -->
                    <div class="oj-flex hth-certificate-file-row">
                        <div class="oj-flex hth-certificate-file-card">
                            <span class="hth-certificate-file-name" data-bind="text: name"></span>
                            <img alt="" class="hth-certificate-file-status" data-bind="loadImage: 'icon-upload-success.svg'" />
                        </div>
                        <a href="#"
                           class="form-button-link hth-certificate-delete-link"
                           data-bind="text: $component.nls.labels.delete, click: $component.onDeleteFile.bind($component, $data)"></a>
                    </div>
                    <!-- /ko -->
                    <!-- /ko -->
                </div>
            </div>
        </div>
    </div>

    <!-- ko if: $baseModel.large() && !$component.approvalMode() -->
    <div class="oj-flex-item oj-lg-4 oj-sm-only-hide oj-md-only-hide hth-certificate-help-panel">
        <help params="baseModel : $baseModel, rootModel : $component, transaction: 'host-to-host-certificate-management'"></help>
    </div>
    <!-- /ko -->

    <div class="oj-flex-item oj-sm-12 hth-certificate-upload-hint-panel"
         data-bind="css: { 'oj-md-8 oj-lg-8': $component.approvalMode() }">
        <div class="oj-flex oj-flex-items-pad notes notes-invert-margin hth-certificate-upload-hint">
            <div class="oj-flex-item oj-sm-12 notes-content" data-bind="text: $component.nls.uploadHint"></div>
        </div>
    </div>

    <div class="oj-flex-item oj-sm-12 hth-certificate-actions button-container">
        <!-- ko if: $component.showReadActions() -->
        <oj-button class="action-button-primary"
                   on-click="[[$component.onEdit]]"
                   :aria-label="[[$component.nls.labels.edit]]"
                   :title="[[$component.nls.labels.edit]]">
            <span data-bind="text: $component.nls.labels.edit"></span>
        </oj-button>
        <oj-button class="action-button-secondary"
                   on-click="[[$component.onCancel]]"
                   :aria-label="[[$component.nls.labels.cancel]]"
                   :title="[[$component.nls.labels.cancel]]">
            <span data-bind="text: $component.nls.labels.cancel"></span>
        </oj-button>
        <oj-button class="action-button-tertiary"
                   on-click="[[$component.onBack]]"
                   :aria-label="[[$component.nls.labels.back]]"
                   :title="[[$component.nls.labels.back]]">
            <span data-bind="text: $component.nls.labels.back"></span>
        </oj-button>
        <!-- /ko -->

        <!-- ko if: $component.isEditMode() -->
        <oj-button class="action-button-primary"
                   on-click="[[$component.onSubmit]]"
                   disabled="[[$component.isSubmitDisabled()]]"
                   :aria-label="[[$component.nls.labels.submit]]"
                   :title="[[$component.nls.labels.submit]]">
            <span data-bind="text: $component.nls.labels.submit"></span>
        </oj-button>
        <oj-button class="action-button-secondary"
                   on-click="[[$component.onCancel]]"
                   :aria-label="[[$component.nls.labels.cancel]]"
                   :title="[[$component.nls.labels.cancel]]">
            <span data-bind="text: $component.nls.labels.cancel"></span>
        </oj-button>
        <!-- /ko -->
    </div>
</div>
<!-- /ko -->

<!-- ko if: $component.isSuccessMode() -->
<div class="oj-flex hth-certificate-screen hth-certificate-success-screen">
    <div class="oj-flex-item oj-sm-12">
        <div class="oj-flex review-banner review-banner-success hth-certificate-success-banner">
            <span class="oj-flex oj-sm-align-self-center review-banner__image">
                <img alt="" data-bind="loadImage: 'icon-upload-success.svg'" />
            </span>
            <div class="oj-flex-item review-banner__content review-banner-content">
                <h4 class="review-banner-content__header" data-bind="text: $component.nls.success.title"></h4>
                <div class="review-banner-content__message" data-bind="text: $component.nls.success.message"></div>
            </div>
        </div>

        <div class="hth-certificate-success-details">
            <obdx-row base-model="[[$baseModel]]"
                      dashboard="[[$dashboard]]"
                      label="[[$component.nls.labels.transactionReferenceNumber]]"
                      value="[[$component.transactionReferenceNumber]]"></obdx-row>
            <obdx-row base-model="[[$baseModel]]"
                      dashboard="[[$dashboard]]"
                      label="[[$component.nls.labels.status]]"
                      value="[[$component.nls.labels.pendingApproval]]"></obdx-row>

            <div class="hth-certificate-success-file">
                <div class="label">
                    <oj-label>
                        <span data-bind="text: $component.nls.labels.corporatePublicCertificate"></span>
                    </oj-label>
                </div>
                <div>
                    <!-- ko foreach: $component.confirmationFiles -->
                    <div class="hth-certificate-confirmation-file">
                        <a href="#"
                           class="form-button-link"
                           data-bind="text: name, click: $component.onDownloadCertificate"></a>
                        <a href="#"
                           class="form-button-link hth-certificate-download-link"
                           data-bind="attr: { 'aria-label': $component.nls.labels.downloadCertificate, title: $component.nls.labels.downloadCertificate }, click: $component.onDownloadCertificate">
                            <span class="icons icon-download"></span>
                        </a>
                    </div>
                    <!-- /ko -->
                </div>
            </div>
        </div>

        <div class="hth-certificate-next-actions">
            <div class="hth-certificate-next-title" data-bind="text: $component.nls.labels.whatsNext"></div>
            <ul class="hth-certificate-next-list">
                <li>
                    <a href="#"
                       data-bind="click: $component.goToDashboard, attr: { 'aria-label': $component.nls.labels.goToDashboard, title: $component.nls.labels.goToDashboard }">
                        <img alt="" data-bind="loadImage: 'dashboard/quick-access/dashboard.svg'" />
                        <div data-bind="text: $component.nls.labels.goToDashboard"></div>
                    </a>
                </li>
            </ul>
        </div>

        <div class="hth-certificate-actions hth-certificate-success-actions button-container">
            <oj-button class="action-button-secondary"
                       on-click="[[$component.onSaveAsHtml]]"
                       :aria-label="[[$component.nls.labels.saveAsHtml]]"
                       :title="[[$component.nls.labels.saveAsHtml]]">
                <span data-bind="text: $component.nls.labels.saveAsHtml"></span>
            </oj-button>
        </div>
    </div>
</div>
<!-- /ko -->
