        <oj-label><span data-bind="text:$component.nls.fieldname.hthApiPasswordCode"></span></oj-label>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-9 oj-lg-9">
        <oj-label class="code-label">
          <span class="code fs14" data-bind="text: $component.hthApiPasswordCodeVisible() ? $component.hthApiPasswordCode() : $component.nls.fieldname.hthApiPasswordCodeMask"></span>
          <a href="javascript:void(0);" class="switch-button" data-bind="click:$component.toggleHthApiPasswordCodeVisible">
            <span class="icon login-pin-reset-code-eyecon" data-bind="css:{'icon-eye': $component.hthApiPasswordCodeVisible(), 'icon-eye-slash': !$component.hthApiPasswordCodeVisible()}"></span>
          </a>
        </oj-label>
      </div>
    </div>
    <div class="oj-flex oj-flex-items-pad" style="margin-bottom: 16px;">
      <div class="oj-flex-item oj-sm-12 oj-md-12 oj-lg-12">
        <span class="label" data-bind="text:$baseModel.format($component.nls.info.hthExpiryAfterApproval, {0: 24})"></span>
      </div>
    </div>
    <!-- /ko -->

    <!-- ko if: selectedUserGroupValues().length === 0 -->

      value="[[$component.nls.headers.noUserGroupAssigned]]">
    </obdx-row> <!-- /ko -->

    <!-- ko if: showUserGroup -->
    <div class="oj-flex oj-flex-items-pad">
      <div class="oj-flex-item oj-sm-12 oj-md-4 oj-lg-3">
        <oj-label :for="[['usergrouplist']]"><span data-bind="text:$component.nls.headers.userGroup"></span>
        </oj-label>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-4 oj-lg-9">
        <oj-select-many id="usergrouplist" value="{{selectedUserGroupValues}}" readonly
          placeholder="{{$component.nls.headers.selectUserGroup}}">

          <!-- ko foreach:$component.userGroupValues  -->
          <oj-option value="[[value]]"><span data-bind="text:text"></span></oj-option> <!-- /ko -->
        </oj-select-many>
      </div>
    </div> <!-- /ko -->
    <!-- /ko -->
    <!-- /ko -->

    <!-- ko ifnot: $component.noLimitsHomeEntity-->

    <!-- ko foreach: homeEntityLimitPackage -->

    <!-- ko if: $data.selectedLimitPackage-->

      <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-3">
        <oj-label for="userlimit">
          <span data-bind="text:$data.description"></span>
        </oj-label>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-9 oj-lg-9">
        <span data-bind="text:$data.selectedLimitPackage()"></span>
      </div>
    </div> <!-- /ko -->
    <!-- /ko -->
    <!-- /ko -->

    <!-- ko if: userFullData().userType.enterpriseRoleName ==="retailuser"  || userFullData().userType ==="retailuser" -->

    <!-- ko if: isUserSegmentsFetched-->
    <div class="oj-flex oj-flex-items-pad">
      <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-3 label">
        <oj-label for="segmentName">
          <span data-bind="text:$component.nls.fieldname.segment"></span>
        </oj-label>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-4 label">
        <span data-bind="text:$component.selectedSegmentName"></span>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-6 oj-lg-5">
        <div class="tooltip-section">
          <div class="tooltip message-text" id="segmentRoles_toolTip">

            <!-- ko	if:isSegmentContainsRole -->
            <oj-label class="span-label">
              <span data-bind="text:$component.nls.common.segmentRoles"></span>
            </oj-label>

            <!-- ko foreach: selectedSegmentRoles -->
            <oj-label>
              <li><span data-bind="text:appRoleId"></span></li>
            </oj-label> <!-- /ko -->
            <!-- /ko -->

            <!-- ko	ifnot:isSegmentContainsRole -->
            <oj-label class="span-label">
              <span data-bind="text: $component.nls.common.segmentNoRole"></span>
            </oj-label> <!-- /ko -->
          </div>
          <span class="icon-help" id="tool-tip-holder-segment-role" aria-hidden="true"
            data-bind="event: { mouseover: $component.showToolTip.bind($data,'segmentRoles_toolTip','tool-tip-holder-segment-role'), mouseout: $component.hideToolTip.bind($data,'segmentRoles_toolTip') }"></span>
        </div>
      </div>
    </div> <!-- /ko -->
    <!-- /ko -->
    <div class="oj-flex oj-flex-items-pad">
      <div class="oj-flex-item oj-sm-12 oj-md-12 oj-lg-12">
        <oj-label>
          <span data-bind="text:$component.nls.fieldname.role"></span>
        </oj-label>
      </div>
      <div class="oj-flex-item oj-sm-12 oj-md-12 oj-lg-12">

        <!-- ko if: childRoleEnumsLoaded -->
        <oj-checkboxset id="checkboxSetId" class="oj-choice-direction-row"
          :aria-label="[[$component.nls.fieldname.role]]" disabled="[[true]]"
          value="{{userFullData().applicationRoles}}">

          <!-- ko foreach: childRoleEnums -->
          <oj-option value="{{applicationRoleId}}" :id="[['roles_'+ $index()]]">
            <span data-bind="text:applicationRoleName , attr : {'for' :'roles_' + $index()}"></span>
          </oj-option> <!-- /ko -->
        </oj-checkboxset> <!-- /ko -->
      </div>
    </div>

  </div>
</page-section>
<!-- /ko -->
