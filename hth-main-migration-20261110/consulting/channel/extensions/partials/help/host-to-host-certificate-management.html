<div class="oj-flex oj-flex-items-pad help-content">
    <div class="oj-flex-item help-item">
        <img alt="" data-bind="loadImage: 'info-icon/tips.svg'" />
    </div>
    <div class="oj-flex-item oj-sm-12">
        <h4 class="help-content-title" data-bind="text: $component.helpTitle"></h4>
    </div>
    <div class="oj-flex-item">
        <span data-bind="text: $component.helpDescription"></span>
    </div>
    <div class="oj-flex-item oj-sm-12">
        <a class="form-button-link" href="#" data-bind="text: $component.userGuideLabel"></a>
    </div>
</div>
