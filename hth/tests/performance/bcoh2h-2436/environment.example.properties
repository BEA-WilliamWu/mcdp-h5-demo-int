# Copy to environment.local.properties, not tracked. Java properties: use / in Windows paths.
base_url=https://your-gateway.example
endpoint=/account/v1/transaction-inquiry
scenario=S1
# Or environment HTH_ACCOUNT; a 14/15-digit account, not a login username.
account=
account_type=CUR
currency=HKD
# Explicit host/business date; never silently use the load-generator's current date.
to_date=2026-11-18
# Optional override. Defaults: S1 one day, S4 five days, others two days.
from_date=
# Independently reconciled exact total for selected range; REQUIRED.
expected_count=101
page_size=50
journeys=1
warmup_journeys=0
ramp_seconds=1
pause_ms=1000
max_pages=1000
max_journey_ms=300000
connect_timeout_ms=10000
response_timeout_ms=60000
stop_on_failure=true
check_duplicates=true
success_code=000
# The CLI template uses a pre-existing token. Use token_source=login for Start-time logon.
token_source=env
# Token comes from HTH_TOKEN in env mode. Set the token value without its authorization prefix.
auth_prefix=Bearer
auth_mode=signed
# Use env HTH_CLIENT_ID and HTH_PRIVATE_KEY_FILE, or local properties.
# client_id=...
# private_key_file=C:/secure/client-private-key.pk8.pem
# signing_path=/account/v1/transaction-inquiry
clock_skew_ms=1000
# Optional file of extra static gateway headers (Java properties).
# headers_file=C:/secure/gateway-headers.properties
# Optional Groovy hook for per-request gateway authentication / DPoP. Not a token-refresh implementation.
# auth_hook=C:/secure/auth-hook.groovy
# CSV output: exclude response bodies, request headers and token.
sample_variables=scenario,phase,journey_id,page_no,page_count,total,message_id,cursor_in,complete,journey_ms
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.assertion_results_failure_message=true
httpclient4.retrycount=0
