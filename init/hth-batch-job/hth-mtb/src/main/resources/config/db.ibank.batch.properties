# Native HTH JDBC configuration; values are supplied by the deployment environment.
# Do not paste BCO AES ciphertext here. No BCO config file is read.
jdbc.driver.class=oracle.jdbc.OracleDriver
jdbc.conn.string=${HTH_BATCH_JDBC_URL}
jdbc.conn.username=${HTH_BATCH_JDBC_USER}
jdbc.conn.password=${HTH_BATCH_JDBC_PASSWORD}
jdbc.conn.autocommit=false
