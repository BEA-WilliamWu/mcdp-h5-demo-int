# ============================================
# MTB Batch Job - System Configuration
# ============================================

# Batch output directory
batch.output.dir=./output

# Batch error directory
batch.error.dir=./error

# Batch log directory
batch.log.dir=./logs

# Batch temp directory
batch.temp.dir=./temp

# Date format for batch processing
batch.date.format=yyyyMMdd

# Timestamp format for batch processing
batch.timestamp.format=yyyyMMddHHmmss

# Max memory for batch processing
batch.max.memory=-Xmx1024M

# Batch retry count
batch.retry.count=3

# Batch retry interval (ms)
batch.retry.interval=5000

# CRM_EXTRACT filename: {date} is yyMMdd; command-line date stays yyyyMMdd.
crm.file.pattern=hthtomtb_mvp1apis_D{date}.csv
