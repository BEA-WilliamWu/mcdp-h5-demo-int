openapi: 3.0.3

info:
  title: DSP Support - Password API
  description: |
    Internal CM password setup/reset. CM validates user entitlement and the approved one-time Code.
    Internal APIC authenticates and authorizes the CM subscription before routing to DSP.
    DSP password services do not revalidate APIC client credentials or require a duplicate credential configuration.
    A creates a password; M resets without an old password and creates the first credential for legacy CM users when the exact clientId + closeId pair has no records. Inactive records are not reactivated.
    Password hash format is Base64(raw SHA-256(UTF-8(password))), stored without rehashing.
    OAEP SHA-256, MGF1 SHA-256, empty label; encrypted bytes use Base64.

    ---
    ### Global Required Headers
    The following headers describe requests from CM to internal APIC. APIC validates its client credentials;
    DSP uses the existing shared header processing for Message-Id and Channel.

    | Header Name | Type | Mandatory(M) / Optional(O) | Description | Example |
    | :--- | :--- | :--- | :--- | :--- |
    | **Message-Id** | `string` | **M** | Message ID. Must comply with UUID v4 format. Constant "Server-Define" will lead to UUID generated by HTH system. | `1f0ee48b-ce99-475f-8b72-52a7a492edfa` or `Server-Define` |
    | **Authorization** | `string` | **O** | The access token is returned in logon API. The token includes user closed ID by DSP. | `Bearer eyJhbG...` |
    | **Channel** | `string` | **M** | Distinguish channel (HTH, BCO, BCM). CM sends 'BCO'. | `BCO` |
    | **X-IBM-Client-Id** | `string` | **M** | Internal APIC caller ID, validated by APIC. Reuses the existing BM DSP subscription. | `client-id-12345` |
    | **X-IBM-Client-Secret** | `string` | **M** | Internal APIC caller secret, validated by APIC. Not a DSP password-service configuration. | `client-secret-abcde` |

    ---
  version: "1.0.0"

servers:
  - url: /dsp/api
    description: Jersey application path (dsp-ms-support)

tags:
  - name: Password
    description: DSP password related APIs

paths:

  /password/v1/public-key:
    post:
      tags:
        - Password
      summary: Query RSA public key
      description: |
        Query the RSA public key used for password encryption.

      operationId: queryPublicKey

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicKeyQueryRequest'
            examples:
              queryPublicKey:
                value:
                  hashValue: "c5b389beb081fe1e43ae92e895deca086b4eed5cf9efc7b78eebbbc9dc75c3f0"

      responses:

        '200':
          description: Public key query completed.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyQueryResponse'
              examples:
                success:
                  value:
                    status: "000000"
                    publicKey: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A..."

        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: The mandatory parameter 'hashValue' is missing or empty.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                missingBody:
                  value:
                    message: "Request body is missing or empty."
                    errCode: 500050
                    referenceCode: "REF-PARAM-PASSWORD-001"
                    exceptionType: "com.hkbea.common.exception.ParameterException"

                missingHashValue:
                  value:
                    message: "The mandatory parameter 'hashValue' is missing or empty."
                    errCode: 500051
                    referenceCode: "REF-PARAM-PASSWORD-002"
                    exceptionType: "com.hkbea.common.exception.ParameterException"

        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                signatureVerificationFailed:
                  value:
                    message: "Failed to verify the password_signature."
                    errCode: 600052
                    referenceCode: "REF-SVC-PASSWORD-001"
                    exceptionType: "com.hkbea.dsp.exception.DspSupportErrorMapping"

        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

  /password/v1/modification:
    post:
      tags:
        - Password

      summary: Add or modify password

      description: |
        Add or modify user password.

        Encryption Information:

        Algorithm:
        `RSA`

        Algorithm Transformation:
        `RSA/ECB/OAEPWithSHA-256AndMGF1Padding`

        Password Rules:

        - Base64(raw SHA-256(UTF-8(password))) must first be converted into ASCII bytes. OAEP and MGF1 both use SHA-256 with an empty label.
        - RSA encryption must be performed on the UTF-8 bytes.
        - Encrypted bytes must be encoded using Base64.
        - No old password is required. CM must first validate the approved HTH reset Code.
        - newEncryptedPassword is always mandatory.

      operationId: modifyPassword

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModificationRequest'
            examples:

              addPassword:
                value:
                  function: "A"
                  newEncryptedPassword: "AexEfs8Fef..."
                  randomNumber: "123456"
                  closeId: "CLOSED001"
                  clientId: "CLIENT001"

              modifyPassword:
                value:
                  function: "M"
                  oldEncryptedPassword: ""
                  newEncryptedPassword: "AexEfs8Fef..."
                  randomNumber: "123456"
                  closeId: "CLOSED001"
                  clientId: "CLIENT001"

      responses:

        '200':
          description: Password modification completed.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordModificationResponse'
              examples:
                success:
                  value:
                    status: "000000"
                    message: "Success"

        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: Mandatory parameter is missing or empty.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                signatureVerificationFailed:
                  value:
                    message: "Failed to verify the password_signature."
                    errCode: 600052
                    referenceCode: "REF-SVC-PASSWORD-002"
                    exceptionType: "com.hkbea.dsp.exception.DspSupportErrorMapping"

        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

components:

  headers:
    MessageIdResponse:
      description: Same as request message ID (UUID)
      schema:
        type: string

  schemas:

    PublicKeyQueryRequest:
      type: object
      required:
        - hashValue
      properties:
        hashValue:
          type: string
          minLength: 1
          description: Hash value in UTF-8 format.
          example: "ABC123XYZ456"

    PublicKeyQueryResponse:
      type: object
      required:
        - status
        - publicKey
      properties:

        status:
          type: string
          pattern: '^\d{6}$'
          description: 000000 indicates success.
          example: "000000"

        publicKey:
          type: string
          description: RSA public key encoded in Base64 format.
          example: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A..."

    PasswordModificationRequest:
      type: object
      required:
        - function
        - newEncryptedPassword
        - randomNumber
        - closeId
        - clientId

      properties:

        function:
          type: string
          enum:
            - A
            - M
          description: |
            Password operation type.

            A - Add password

            M - Reset password after CM validates the approved Code. Update the active
            credential for the exact clientId + closeId pair, or create its first
            credential when no record exists for that pair (legacy CM compatibility).
            If only inactive records exist, reject the request without reactivating them.
            Query failures and write failures must not trigger a fallback insert or retry.
          example: "M"

        oldEncryptedPassword:
          type: string
          description: |
            Old password encrypted by:

            RSA/ECB/OAEPWithSHA-256AndMGF1Padding

            Base64 encoded encrypted bytes.

            Deprecated and ignored; approved-Code reset does not require the old password.
          example: "BexEfs9Def..."

        newEncryptedPassword:
          type: string
          minLength: 1
          description: |
            New password encrypted by:

            RSA/ECB/OAEPWithSHA-256AndMGF1Padding

            Base64(raw SHA-256(UTF-8(password))) must first be converted into ASCII bytes. OAEP and MGF1 both use SHA-256 with an empty label.

            Base64 encoded encrypted bytes.
          example: "AexEfs8Fef..."

        randomNumber:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit random number in UTF-8 format.
          example: "123456"

        closeId:
          type: string
          minLength: 1
          maxLength: 128
          description: Close ID in UTF-8 format.
          example: "CLOSED001"

        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: Client ID in UTF-8 format.
          example: "CLIENT001"

    PasswordModificationResponse:
      type: object
      required:
        - status
        - message

      properties:

        status:
          type: string
          pattern: '^\d{6}$'
          description: 000000 indicates success.
          example: "000000"

        message:
          type: string
          description: Response message in UTF-8 format.
          example: "Success"