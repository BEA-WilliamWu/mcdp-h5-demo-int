openapi: 3.0.3

info:
  title: DSP Support - Password API
  description: |
    API documentation for Password.

    ---
    ### Global Required Headers
    To ensure API security and traceability, all requests must include the following headers.

    | Header Name | Type | Mandatory(M) / Optional(O) | Description | Example |
    | :--- | :--- | :--- | :--- | :--- |
    | **Message-Id** | `string` | **M** | Message ID. Must comply with UUID v4 format. Constant "Server-Define" will lead to UUID generated by HTH system. | `1f0ee48b-ce99-475f-8b72-52a7a492edfa` or `Server-Define` |
    | **Authorization** | `string` | **O** | The access token is returned in logon API. The token includes user closed ID by DSP. | `Bearer eyJhbG...` |
    | **Channel** | `string` | **M** | Distinguish channel (HTH, BCO, BCM). Corporate hardcode 'HTH'. | `HTH` |
    | **X-IBM-Client-Id** | `string` | **M** | APIC client ID. Corporate retrieves the info when onboarding. | `client-id-12345` |
    | **X-IBM-Client-Secret** | `string` | **M** | APIC secret. Corporate retrieves the info when onboarding. | `client-secret-abcde` |

    ---
  version: "1.0.0"

servers:
  - url: /dsp/api
    description: Jersey application path (dsp-ms-support)

tags:
  - name: Password
    description: DSP password related APIs

paths:

  /password/v1/public-key:
    post:
      tags:
        - Password
      summary: Query RSA public key
      description: |
        Query the RSA public key used for password encryption.

      operationId: queryPublicKey

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicKeyQueryRequest'
            examples:
              queryPublicKey:
                value:
                  hashValue: "ABC123XYZ456"

      responses:
        '400':
          description: CM protocol rejected before write (invalid context, key expiry, ciphertext or credential state).
        '403':
          description: CM protocol caller is not the configured internal APIC subscription.

        '200':
          description: Public key query completed.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyQueryResponse'
              examples:
                success:
                  value:
                    status: "000000"
                    publicKey: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A..."

        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: The mandatory parameter 'hashValue' is missing or empty.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                missingBody:
                  value:
                    message: "Request body is missing or empty."
                    errCode: 500050
                    referenceCode: "REF-PARAM-PASSWORD-001"
                    exceptionType: "com.hkbea.common.exception.ParameterException"

                missingHashValue:
                  value:
                    message: "The mandatory parameter 'hashValue' is missing or empty."
                    errCode: 500051
                    referenceCode: "REF-PARAM-PASSWORD-002"
                    exceptionType: "com.hkbea.common.exception.ParameterException"

        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                signatureVerificationFailed:
                  value:
                    message: "Failed to verify the password_signature."
                    errCode: 600052
                    referenceCode: "REF-SVC-PASSWORD-001"
                    exceptionType: "com.hkbea.dsp.exception.DspSupportErrorMapping"

        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

  /password/v1/modification:
    post:
      tags:
        - Password

      summary: Add or modify password

      description: |
        Add or modify user password.

        Encryption Information:

        Algorithm:
        `RSA`

        Algorithm Transformation:
        `RSA/ECB/OAEPWithSHA-256AndMGF1Padding`

        Password Rules:

        - Password text must first be converted into UTF-8 bytes.
        - RSA encryption must be performed on the UTF-8 bytes.
        - Encrypted bytes must be encoded using Base64.
        - oldEncryptedPassword is mandatory when function = M.
        - newEncryptedPassword is always mandatory.

      operationId: modifyPassword

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModificationRequest'
            examples:

              addPassword:
                value:
                  function: "A"
                  newEncryptedPassword: "AexEfs8Fef..."
                  randomNumber: "123456"
                  closeId: "CLOSED001"
                  clientId: "CLIENT001"

              modifyPassword:
                value:
                  function: "M"
                  oldEncryptedPassword: "BexEfs9Def..."
                  newEncryptedPassword: "AexEfs8Fef..."
                  randomNumber: "123456"
                  closeId: "CLOSED001"
                  clientId: "CLIENT001"

      responses:
        '400':
          description: CM protocol rejected before write (invalid context, key expiry, ciphertext or credential state).
        '403':
          description: CM protocol caller is not the configured internal APIC subscription.

        '200':
          description: Password modification completed.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordModificationResponse'
              examples:
                success:
                  value:
                    status: "000000"
                    message: "Success"

        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: Mandatory parameter is missing or empty.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'
              examples:
                signatureVerificationFailed:
                  value:
                    message: "Failed to verify the password_signature."
                    errCode: 600052
                    referenceCode: "REF-SVC-PASSWORD-002"
                    exceptionType: "com.hkbea.dsp.exception.DspSupportErrorMapping"

        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              $ref: '#/components/headers/MessageIdResponse'
          content:
            application/json:
              schema:
                $ref: './common/common-exceptions.0.0.openapi.yaml#/components/schemas/ExceptionEntity'

components:

  headers:
    MessageIdResponse:
      description: Same as request message ID (UUID)
      schema:
        type: string

  schemas:

    PublicKeyQueryRequest:
      type: object
      required:
        - hashValue
      properties:
        protocol:
          type: string
          enum: [CM_SHA256_BASE64_V1]
          description: Optional internal CM protocol; absent preserves the existing A/M protocol.
        clientId:
          type: string
          maxLength: 64
          description: Required for CM. Business client ID from HTH management, not the APIC subscription ID.
        closeId:
          type: string
          maxLength: 128
          description: Required for CM. Full user ID including @partyId.
        requestId:
          type: string
          format: uuid
          description: Required for CM; binds the key to this request and identity.
        queryOnly:
          type: boolean
          default: false
          description: CM status lookup only; returns credentialStatus without generating a key.
        hashValue:
          type: string
          minLength: 1
          description: For CM, lowercase hex SHA256(UTF8(six-digit randomNumber)); ignored for queryOnly.
          example: "ABC123XYZ456"

    PublicKeyQueryResponse:
      type: object
      required:
        - status
      properties:
        protocol:
          type: string
          description: CM_SHA256_BASE64_V1 for internal CM responses.
        credentialStatus:
          type: string
          enum: [NOT_SETUP, ACTIVE]
          description: DSP authoritative credential existence for the specified client and close ID; CM only.

        status:
          type: string
          pattern: '^\d{6}$'
          description: 000000 indicates success.
          example: "000000"

        publicKey:
          type: string
          description: Base64 DER SPKI RSA-2048 public key; omitted for CM queryOnly. Valid for five minutes.
          example: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A..."

    PasswordModificationRequest:
      type: object
      required:
        - function
        - newEncryptedPassword
        - randomNumber
        - closeId
        - clientId

      properties:
        protocol:
          type: string
          enum: [CM_SHA256_BASE64_V1]
          description: Optional internal CM protocol. Requires dedicated internal APIC subscription and Channel BCO.
        requestId:
          type: string
          format: uuid
          description: Required for CM and must match public-key request.

        function:
          type: string
          enum:
            - A
            - M
            - R
          description: |
            Password operation type.

            A - Add password

            M - Legacy change with old password verification.

            R - CM reset after CM validates and reserves the approval Code; internal CM protocol only.
          example: "M"

        oldEncryptedPassword:
          type: string
          description: |
            Old password encrypted by:

            RSA/ECB/OAEPWithSHA-256AndMGF1Padding

            Base64 encoded encrypted bytes.

            Mandatory when function = M.
          example: "BexEfs9Def..."

        newEncryptedPassword:
          type: string
          minLength: 1
          description: |
            New password encrypted by:

            RSA/ECB/OAEPWithSHA-256AndMGF1Padding

            Legacy protocol: password converted to UTF-8 bytes (unchanged).

            CM_SHA256_BASE64_V1: encrypt UTF8(Base64(SHA256(UTF8(password))));
            OAEP digest SHA-256, MGF1 SHA-256, empty label, RSA-2048.
            DSP stores the decrypted canonical Base64 digest without hashing again.
            CM A creates only; CM R replaces only an existing active credential.

            Base64 encoded encrypted bytes.
          example: "AexEfs8Fef..."

        randomNumber:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit random number in UTF-8 format.
          example: "123456"

        closeId:
          type: string
          minLength: 1
          maxLength: 128
          description: Close ID in UTF-8 format.
          example: "CLOSED001"

        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: Client ID in UTF-8 format.
          example: "CLIENT001"

    PasswordModificationResponse:
      type: object
      required:
        - status
        - message

      properties:

        status:
          type: string
          pattern: '^\d{6}$'
          description: 000000 indicates success.
          example: "000000"

        message:
          type: string
          description: Response message in UTF-8 format.
          example: "Success"