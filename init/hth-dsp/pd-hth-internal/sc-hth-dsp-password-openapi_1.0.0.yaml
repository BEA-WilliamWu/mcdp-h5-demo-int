# Contract source: dsp-ms-support-api/src/main/resources/api/dsp-support-password-1.0.0.openapi.yaml
# Swagger 2.0 packaging for internal APIC; backend and TLS policies match the DSP Client API.
swagger: "2.0"
info:
  version: "1.0.0"
  title: "SC-HTH-DSP-PASSWORD-OPENAPI"
  x-ibm-name: sc-hth-dsp-password-openapi
  description: |
    Internal CM HTH API password setup/reset, routed to dsp-ms-support.
    Internal APIC validates X-IBM-Client-Id and X-IBM-Client-Secret using the existing subscription.
    CM validates user entitlement and the approved one-time Code before password modification.
    Message-Id and Channel are required; Authorization is optional. CM sends Channel BCO.
    No BFF-only Client-Id, Request-Time or Request-Sign header is required by this API.

    Query public-key with lowercase hex SHA-256(randomNumber), then reuse the same six-digit randomNumber.
    Encrypt Base64(raw SHA-256(UTF-8(password))) using the returned RSA public key.
    RSA-OAEP and MGF1 both use SHA-256, with an empty label; encode encrypted bytes as Base64.
    function A creates a password; M replaces an existing active password without an old password.
schemes:
  - "https"
host: $(catalog.host)
basePath: /dsp/api
tags:
  - name: Password
    description: Internal CM password setup and reset
security:
  - clientIdHeader: []
    clientSecretHeader: []
securityDefinitions:
  clientSecretHeader:
    type: apiKey
    name: X-IBM-Client-Secret
    in: header
  clientIdHeader:
    type: apiKey
    in: header
    name: X-IBM-Client-Id
x-ibm-configuration:
  phase: realized
  testable: true
  enforced: true
  properties:
    x-ibm-gateway-optimize-invoke:
      value: 'false'
      description: Disable invoke-to-proxy optimization
      encoded: false
  cors:
    enabled: true
  application-authentication:
    certificate: false
  rate-limit:
    rate-limit:
      value: 300000/1hour
      hard-limit: true
    burst-limit:
      value: 160/1second
      hard-limit: true
  assembly:
    catch:
      - errors:
          - ConnectionError
        execute:
          - gatewayscript:
              title: Custom backend timeout response
              version: 1.0.0
              source: |-
                var apim = require('local:///isp/policy/apim.custom.js');
                var error = apim.getError();
                var messageId = apim.getvariable('message.headers.Message-Id') || '';
                apim.setvariable(
                  'message.status.code',
                  503,
                  'set'
                );
                apim.setvariable(
                  'message.status.reason',
                  'Gateway Timeout',
                  'set'
                );
                apim.setvariable(
                  'message.headers.content-type',
                  'application/json; charset=utf-8',
                  'set'
                );
                apim.setvariable(
                  'message.body',
                  JSON.stringify({
                    message: 'The requested service is temporarily unavailable or undergoing maintenance. Please try again later.',
                    errCode: 900001,
                    referenceCode: messageId
                  }),
                  'set'
                );
                apim.output('application/json');
      - errors:
          - "503"
        execute:
          - gatewayscript:
              title: Custom service unavailable response
              version: 1.0.0
              source: |-
                var apim = require('local:///isp/policy/apim.custom.js');
                var error = apim.getError();
                var messageId = apim.getvariable('message.headers.Message-Id') || '';
                apim.setvariable(
                  'message.status.code',
                  503,
                  'set'
                );
                apim.setvariable(
                  'message.status.reason',
                  'Service Unavailable',
                  'set'
                );
                apim.setvariable(
                  'message.headers.content-type',
                  'application/json; charset=utf-8',
                  'set'
                );
                apim.setvariable(
                  'message.body',
                  JSON.stringify({
                    message: 'The requested service is temporarily unavailable or undergoing maintenance. Please try again later.',
                    errCode: 900000,
                    referenceCode: messageId
                  }),
                  'set'
                );
                apim.output('application/json');
    execute:
      - set-variable:
          title: Convert x-requestid
          version: 1.0.0
          description: Convert x-requestid into x-b3-traceid
          actions:
            - value: $(request.headers.x-requestid)
              add: message.headers.x-b3-traceid
      - invoke:
          title: invoke-backend
          version: 1.0.0
          verb: keep
          target-url: $(icp-url)$(request.path)$(request.search)
          timeout: 30
          tls-profile: $(ssl-client)
          stop-on-error:
            - ConnectionError
  gateway: datapower-gateway
  type: rest
paths:
  /password/v1/public-key:
    post:
      tags:
        - Password
      summary: Query RSA public key
      description: |
        Query the RSA public key used for password encryption.
      operationId: queryPublicKey
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/MessageId'
        - $ref: '#/parameters/Channel'
        - $ref: '#/parameters/Authorization'
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PublicKeyQueryRequest'
      responses:
        '200':
          description: Public key query completed.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/PublicKeyQueryResponse'
          examples:
            application/json:
              status: '000000'
              publicKey: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...
        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: The mandatory parameter 'hashValue' is missing or empty.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
          examples:
            application/json:
              message: Request body is missing or empty.
              errCode: 500050
              referenceCode: REF-PARAM-PASSWORD-001
              exceptionType: com.hkbea.common.exception.ParameterException
        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
          examples:
            application/json:
              message: Failed to verify the password_signature.
              errCode: 600052
              referenceCode: REF-SVC-PASSWORD-001
              exceptionType: com.hkbea.dsp.exception.DspSupportErrorMapping
        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
  /password/v1/modification:
    post:
      tags:
        - Password
      summary: Add or modify password
      description: |
        Add or modify user password.

        Encryption Information:

        Algorithm:
        `RSA`

        Algorithm Transformation:
        `RSA/ECB/OAEPWithSHA-256AndMGF1Padding`

        Password Rules:

        - Base64(raw SHA-256(UTF-8(password))) must first be converted into ASCII bytes.
        - RSA encryption must be performed on the UTF-8 bytes.
        - Encrypted bytes must be encoded using Base64.
        - No old password is required. CM must first validate the approved HTH reset Code.
        - newEncryptedPassword is always mandatory.
      operationId: modifyPassword
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - $ref: '#/parameters/MessageId'
        - $ref: '#/parameters/Channel'
        - $ref: '#/parameters/Authorization'
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PasswordModificationRequest'
      responses:
        '200':
          description: Password modification completed.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/PasswordModificationResponse'
          examples:
            application/json:
              status: '000000'
              message: Success
        '450':
          description: |
            Parameter Exception.

            Possible Error Codes:
            - **500050**: Request body is missing or empty.
            - **500051**: Mandatory parameter is missing or empty.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
        '460':
          description: |
            Service Exception.

            Possible Error Codes:
            - **600052**: Failed to verify the password_signature.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
          examples:
            application/json:
              message: Failed to verify the password_signature.
              errCode: 600052
              referenceCode: REF-SVC-PASSWORD-002
              exceptionType: com.hkbea.dsp.exception.DspSupportErrorMapping
        '470':
          description: |
            System Exception.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
        '490':
          description: |
            Other / General Exception.
          headers:
            Message-Id:
              type: string
              description: Same as request message ID (UUID)
          schema:
            $ref: '#/definitions/ExceptionEntity'
definitions:
  PublicKeyQueryRequest:
    type: object
    required:
      - hashValue
    properties:
      hashValue:
        type: string
        minLength: 64
        description: >-
          Lowercase hexadecimal SHA-256 of the six-digit randomNumber. Reuse that randomNumber in the password
          modification request.
        example: 8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92
        maxLength: 64
        pattern: '^[0-9a-f]{64}$'
  PublicKeyQueryResponse:
    type: object
    required:
      - status
      - publicKey
    properties:
      status:
        type: string
        pattern: '^\d{6}$'
        description: 000000 indicates success.
        example: '000000'
      publicKey:
        type: string
        description: RSA public key encoded in Base64 format.
        example: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...
  PasswordModificationRequest:
    type: object
    required:
      - function
      - newEncryptedPassword
      - randomNumber
      - closeId
      - clientId
    properties:
      function:
        type: string
        enum:
          - A
          - M
        description: |
          Password operation type.

          A - Add password

          M - Modify password
        example: M
      oldEncryptedPassword:
        type: string
        description: |
          Old password encrypted by:

          RSA/ECB/OAEPWithSHA-256AndMGF1Padding

          Base64 encoded encrypted bytes.

          Deprecated and ignored; approved-Code reset does not require the old password.
        example: BexEfs9Def...
      newEncryptedPassword:
        type: string
        minLength: 1
        description: |
          New password encrypted by:

          RSA/ECB/OAEPWithSHA-256AndMGF1Padding

          Base64(raw SHA-256(UTF-8(password))) must first be converted into ASCII bytes.

          Base64 encoded encrypted bytes.
        example: AexEfs8Fef...
      randomNumber:
        type: string
        pattern: '^\d{6}$'
        description: 6-digit random number in UTF-8 format.
        example: '123456'
      closeId:
        type: string
        minLength: 1
        maxLength: 128
        description: Close ID in UTF-8 format.
        example: CLOSED001
      clientId:
        type: string
        minLength: 1
        maxLength: 64
        description: Client ID in UTF-8 format.
        example: CLIENT001
  PasswordModificationResponse:
    type: object
    required:
      - status
      - message
    properties:
      status:
        type: string
        pattern: '^\d{6}$'
        description: 000000 indicates success.
        example: '000000'
      message:
        type: string
        description: Response message in UTF-8 format.
        example: Success
  ExceptionEntity:
    type: object
    description: Exception response returned for HTTP 450/460/470/490
    properties:
      errCode:
        type: integer
        description: '6-digit error code. 50xxxx – Parameter, 60xxxx – Service, 70xxxx – System, 90xxxx – General'
        example: 500000
      message:
        type: string
        description: Error message
        example: parameter is invalid
      referenceCode:
        type: string
        description: Server-side reference code for log tracing
        example: abc12345
      exceptionType:
        type: string
        description: Fully qualified exception class name
        example: com.hkbea.common.exception.ParameterException
parameters:
  MessageId:
    name: Message-Id
    in: header
    required: true
    type: string
    maxLength: 36
    description: 'UUID v4, or Server-Define to let DSP generate a message ID.'
  Channel:
    name: Channel
    in: header
    required: true
    type: string
    enum:
      - HTH
      - BCO
      - BCM
    description: 'CM sends BCO, using the existing DSP subscription.'
  Authorization:
    name: Authorization
    in: header
    required: false
    type: string
    description: Optional Bearer access token. Internal APIC authenticates the existing client ID and secret.
